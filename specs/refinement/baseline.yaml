- id: D-046
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Corrections that keep every decision, with their reasons
  choice: '(1) the Chaum-Pedersen challenge hashes the whole statement including `Y_{i,lab}`; a challenge without it admits
    a forged partial that blames an honest dealer (A-F3). (2) Theorem D restated claims pseudorandomness of `Z_lab` and `KDF(Z_lab)`,
    and for `y` only security of the encryption to the published `P` (A-F4). (3) A cold start through `E` without a verifiable
    board record of the window burns every ECDSA slot unclaimed at the checkpoint, the reservation window of the Sessions
    rule; the same rule covers cold-start path 1 and the recovery transition of §5.8 (A-F5, B-F11). (4) Capsules carry `R_0`
    per half, a salt seed per variant, the initiator term `T_0` and the signing set; frame capacities drop by one actor (A-F6).
    (5) An `open` witness entry is provisional until its block has a QC (A-F8). (6) C10 is narrowed to nodes that cannot enumerate
    the candidate `(x(Q), m)` (A-F9). (7) C8, C9, C10, C21 hold below `t` nodes or broken enclaves; §9.2 drops C8 and C12
    from the kept columns (A-F10). (8) B6 is PARTIAL: the mempool sees a broadcast transaction (A-F11). (9) A network-created
    shard is proved by `pop_U` at registration plus a proof of `δ` at birth, which links one holder''s addresses in non-TEE
    mode (A-F12).'
  rationale: 'Considered options: fix in place or record as open items; each fix below is a single rule or a status change,
    so fixed in place.'
