- id: D-052
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: The committee writes Midnight per checkpoint, epoch and boot, never per request
  choice: 'D2 (c). The leaf is `(auth, outcome)`. `ic` commits to the intent, so `auth` and the outcome fix the successor,
    and the leaf needs no successor field that nodes could not check. FINAL and RELEASED count only by the root path. A carried
    FINAL could not be seen on Midnight, and after a whole-committee restart with a lost board tail the nodes could settle
    the same `auth` again with another outcome. A carried VOID is recorded on Midnight, so a replaying node refuses its request.
    (e) is rejected for that reason. (d) is rejected because it adds a key and circuit cost to hide a link that the same-block
    settlement already showed. The reissue link is a stated limit (§6.4 item 17). A request that a restart ends settles VOID
    only when its pinned input is unspent on the host chain, FINAL when the host shows its own transaction, and RELEASED otherwise.
    D4 (c), the form of Sessions D-034. The contract rule after a restart is `cp2.h ≥ cp1.h + B` and `cp2.pending_min > cp1.h
    + B` for every pool. The restart burn is `[pending_min, h + B]`. The proof in DESIGN §7.13 shows that this burn holds
    every index of the list burn, that its extra indices can never bind, that the new rule implies the list rule, that an
    honest `cp2` passes it, and that a rollback of every disk changes neither, because both read only landed Midnight fields.
    `pending_root` lets seald check a pending index at `slot_bind` by a membership path, and seald refuses an index below
    `pending_min` from the checkpoint alone. (d) is rejected: it moves the restart rule off Midnight, the one place a rollback
    of every disk cannot reach. D3 and D5 (b). The board refuses a second call on one `nf`, each node checks `nf` against
    the leaves of every landed `bf_root`, and the checkpoint signers refuse a `bf_root` that repeats an `nf`. The contract
    holds roots, not nullifiers, so it does not check duplicates. `FenrirAssets` takes no direct `authorize` for a board-first
    record. The root-age bound becomes the charter bound minus one checkpoint interval and `F_M`. D9 (b), D10: `E_c` goes
    encrypted to the holder in the birth record. D12 (b): rotation opens every new epoch, so one record per epoch serves every
    node. S1: SCHEME states that the board is not Midnight. Authority: the owner''s standing rule of 2026-11-14 on Midnight
    writes. The lead decides each option above under the owner''s order to decide with reasons. This entry replaces the checkpointed
    `nf` set of entry 50 item (5) and the pending list of entry 51 items 4 and 5.'
  rationale: 'Considered options: D2: (a) keep one `settle` per request; (b) a `settle_root` per checkpoint only, so every
    next spend and every reissue waits up to 60 s plus `F_M`; (c) `settle_root` per checkpoint, with the VOID settlement carried
    in the reissue''s `authorize` and checked by the contract in the clear; (d) as (c) with the carried settlement checked
    inside the proof, which needs a new committee key on Midnight''s embedded curve and `q` signature checks in the circuit;
    (e) carried settlements for every outcome. D4: (a) keep the pending list; (b) `pending_min` alone; (c) `pending_min`,
    `pending_root` and `pending_count`; (d) let the checkpoint signers check disjointness after a restart, off Midnight. D3
    and D5: (a) keep the relay and the checkpointed `nf` set; (b) one `bf_root` per checkpoint that is also the nullifier
    root of the batch. D9: (a) one Midnight write per pool key; (b) one pool-key root per batch of `N_pk` keys, with membership
    proved in `authorize`. D12: (a) `n` records per epoch; (b) one `EKS_e` record per epoch with `q` signatures.'
  authority: 'Owner ruling 2026-11-14, verbatim in LOOP.md log: ''use the batched design you are insane to make that many
    commits to midnight save space, tokens, and transactions''.'
