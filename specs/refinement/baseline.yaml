  title: A precedence lapse is a state of the request, not an event at `b + Δ_c`
  choice: '(a). The lead''s rule reads "while the authorization is not in force at any board height at or above `b + Δ_c`".
    An authorization in force stays in force (AU-010), so that condition is the one at `b + Δ_c`, and SL-005 states it that
