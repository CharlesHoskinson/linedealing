- id: D-071
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: The pending list of a checkpoint holds no index below the `pending_min` of the previous landed checkpoint
  choice: '(a). An index below the previous floor never gets an honest vote and ends its request VOID with SLOT_TAKEN (SL-013),
    and seald refuses it at `slot_bind`, so leaving it out of the list loses no slot that can bind. The honest `pending_min`
    is then never below the previous floor: a list entry is at or above it, and an empty list gives `h + 1`, which is above
    it because the previous checkpoint had `pending_min ≤ h + 1` (CP-008) and `h` does not fall (CP-007). CP-040 refuses only
    a dishonest or rolled-back checkpoint again. DESIGN §4.1 (reservation window) and §7.13 (contract rules); CP-014 with
    a new scenario; the note of CP-040. Authority: owner ruling, 2026-11-15 (item 14c finding F7, fix (a)).'
  rationale: 'Considered options: (a) CP-014 lists only the slots at or above the `pending_min` of the previous landed checkpoint
    for that pool. A first checkpoint, or a pool that the previous landed checkpoint does not list, has no floor and lists
    every slot that a live request holds. SL-004 stays as it is. (b) SL-004 gives no precedence on an index below the window
    of the latest landed checkpoint. Not chosen: it changes the slot ledger for every header, and a node then needs the landed
    checkpoint at opening to decide precedence, while (a) changes one sentence and closes the block at the checkpoint where
    it arises. (c) Keep both rules and let CP-040 ignore a lower `pending_min` that only such precedence causes. Rejected:
    the contract cannot see why the floor fell, and CP-040 exists to refuse exactly such a checkpoint from rolled-back disks.'
  authority: 'Owner ruling, 2026-11-15 (item 14c finding F7: CP-014 lists only indices at or above the previous pending_min;
    SL-004 unchanged).'
  evidence_refs:
  - SRC-001
  - SRC-002
  affected_ids:
  - CTX-004
  - MOD-004
  record_ref: design/enhancement/DECISIONS.md entry 71
  driver_refs: &id082
