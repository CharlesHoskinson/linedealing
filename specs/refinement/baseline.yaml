revision: 7
revision_note: 'Revision 1: Architecture and Technical Decisions stage of LOOP item 12 on mpcexperiments 4a20ccc with DECISIONS
  53 and 54 from quint-split. Revision 2: lead resolves Q-007 (SH-023 form kept) and Q-008 (new RQ-068, RQ-005 excepts the
  restart re-end, RQ-048 points to RQ-068, RQ-054 lets the restart leaf supersede a leaf that Midnight does not hold, DECISIONS
  58). Revision 3: fixes for the item 14 Quint findings, DECISIONS 59 to 63: RQ-069 RELEASE before send in NON_TEE mode (F1,
  D-059); AU-029 and AU-025 keep a LOCKED record LOCKED after a VOID settlement (F5, D-060); RQ-045, RQ-072, RQ-071 tombstone
  reason by f + 1 posts or MIXED, Q-002 resolved (F2, D-061); EN-023 public check exp_c < exp (F3, D-062); SL-005 state-driven
  lapse (F4, D-063). Revision 4: owner ruling on finding F6 of the revision 3 run, DECISIONS 64: RQ-073 no reason STALLED
  with any_release = true, RQ-074 no STALLED reason post after a RELEASE, RQ-045 and RQ-072 count reason posts, late admission
  stays allowed (D-064). Revision 5: lead rulings on the replay of the item 14 Quint traces through the Lean oracle, DECISIONS
  70: RQ-075 refuses a frame for an OPENED or ADMITTED target with late_contribution, RQ-076 keeps any_release and released
  across a restart that loses the board tail, its note says that RQ-020 also refuses the ORDERED hold above exp_c (D-070).
  Revision 6: owner ruling on finding F7 of the item 14c run, DECISIONS 71: CP-014 lists only the committee slots at or above
  the pending_min of the previous landed checkpoint, so a precedence below the landed floor (SL-004) no longer makes CP-040
  refuse the honest checkpoint; SL-004 unchanged (D-071). Revision 7: committee handoff, LOOP item 41, DECISIONS 79 to 86:
  new capability split-handoff (HO-001 to HO-068, MOD-007, CTX-008, CON-008); CP-006 puts EKS_e into the activation record
  in place of a separate Key Registry write (D-083); CP-003 counts t checkpoint signers (D-086).'
