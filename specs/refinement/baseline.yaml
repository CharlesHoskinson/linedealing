  title: A restart leaf supersedes a settlement leaf that Midnight does not hold; a leaf that Midnight holds is never replaced
  choice: '(a). Midnight holds a leaf when a landed `settle_root` covers it or when a reissue''s `authorize` carried it as
    a VOID settlement (§5.9). A request that ended after the latest landed checkpoint has no leaf under a landed `settle_root`.
