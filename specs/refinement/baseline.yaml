  title: 'What moves: standing secrets before the arming, `k_nf` unchanged, the backup at `E` kept, epoch keys and the seal
    group new'
  choice: (a). `HANDOFF.md` §6 and findings A2, A7, A8 and A12; DESIGN §3.9, §7.8 and §8.3. Lead pick, for owner confirmation.
  rationale: 'Considered options: (a) Carry `x_f` per curve and every unused ECDSA slot share in CARRY, before READY. Carry
    `k_nf` unchanged. Keep the backup at `E`, which holds constant terms that a handoff does not change. Regenerate epoch
    keys and the seal group, and discard free Schnorr slots. Scope the seald committee descriptor to the epoch. Erase every
    old share and key at grace end. Burn a carried slot copy when the board shows the slot used. (b) Deal a new backup to
    `E` after every rotation, as §3.9 said. Rejected: it adds a step with `E` to every handoff and gains nothing, because
    the backed-up values do not change. (c) Derive a new `k_nf` per epoch. Rejected: a carried ECDSA slot would get a second
    nullifier, and the seat-log check that no covered entry binds one nullifier to two tickets would miss the second binding.
    (d) Erase old `x_f` shares at the activation. Rejected: until O5 closes, the epoch in grace is the only dealer source
    that can replace a committee that cannot sign.'
