- id: D-050
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Further corrections from review 3 that keep every decision
  choice: '(1) one honest combiner sends `Z_{j_g,g}` with the proved partials so every node can post a verified VOID, and
    ECDSA slot records hold escrow commitments by leaf id (B-F8). (2) Binding factors and `CL` use the leaf id, and `cm_addr`
    binds `chain_id` and the Taproot root (B-F9). (3) ECDSA actor table bytes counted in `sizes.py` (B-F10). (4) Witness `slot`
    keys carry suite and epoch, or the ECDSA slot record (B-F13). (5) Board-first: `nf` enters the pending set only after
    the proof verifies, the root-age check keeps a relay margin, and the pending set is checkpointed (B-F15; O29 stays open).
    (6) STALLED is a board predicate at height `exp_c`, and a complained contribution frame is detached (B-F16). (7) The hold
    check compares Midnight heights only, and P2 waits `Δ_hold` Midnight blocks before generation 1 (B-F17). (8) BIRTH_OK
    goes to the coordinator, not the board, and vote kinds are a stated limit (B-F18). (9) The ECDSA slot session runs in
    the clear in both modes: stated, B1 for ECDSA is PARTIAL in TEE mode, and encryption is O35 (B-F19). (10) The TEE claims
    carry the rollback bound `n − 1 − 2f`, and `slot_anchor` (O32) is the committee-wide remedy, because `x_f` is shared by
    every charter (B-F20). (11) C1 and C2 need fewer than `q` broken enclaves (B-F21). (12) O5 states that the complaint window
    of §8.1 needs synchrony (B-F22). (13) C2, C5, C6, C7 name their missing obligations (B-F23).'
  rationale: 'Considered options: fix in place, or record as open items; the single-rule fixes are made in place, the larger
    ones are open items O34 and O35.'
