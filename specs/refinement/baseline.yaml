- id: D-027
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Slot pool
  choice: 'Per-node slot commitments are evaluated lazily and cached; a dealer''s batch of slot dealings is checked with one
    equation (Carbon, Astra, Fable). A committee slot serves one (generation, input) pair, not one variant (Fable): the committee
    releases one partial per slot, for the one variant that is broadcast, so `K` variants on one slot never yield two committee
    partials. `G_max = 2` generations per request is a protocol constant; a second fee bump is a new request. C12''s counting
    is restated around the anchor (proof obligation). ECDSA keeps `K·L` slots: two user halves on one ECDSA slot reveal the
    user''s slot secrets.'
  rationale: 'Considered options: (a) one committee slot per (variant, input); (b) one committee slot per (generation, input)
    with one partial per slot; (c) one committee nonce per slot for all variants without the one-partial rule (rejected: ROS).'
