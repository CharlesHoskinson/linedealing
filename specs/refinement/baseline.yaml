- id: D-038
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: The release witness is sent after the anchor, not on the ADMIT vote
  choice: 'Item 29 puts the TEE witness on board votes. The digest of a release entry is `(j_g, H(tickets))`, and `j_1` is
    fixed only by the OBS reports of the committed ADMIT block, so a node cannot attach that entry to its own ADMIT vote.
    `open` entries ride on the vote for the ordering block; `release` and `slot` entries go in one batched message per peer
    and board height right after the anchor; peers flush once per height in both cases. The entry digests are unchanged, so
    the bound of §7.7 needs no new proof. Fable''s merge of the open and release witness is not taken: it changes the digest
    and needs a proof.'
  rationale: 'Considered options: (a) witness on the ADMIT vote (entry 29); (b) `open` entries on the ordering vote, `release`
    and `slot` entries in one batched message per peer and height after the anchor; (c) merge open and release witness (Fable;
    changes the digest).'
