  choice: '(a). EN-012 keeps only the missing `ic` or `r_tkc`. RQ-025 takes the `tkc` and `hd` match once the authorization
    is in force. SL-016 posts SLOT_TAKEN only while the authorization of the request is in force. RQ-023 names both admission
    checks. DESIGN §4.7, §5.2 item 4, §5.4 items 1 and 2. Authority: lead decision under owner delegation, 2026-11-15 (item
    17a).'
