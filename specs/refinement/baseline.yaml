- id: D-051
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Split-line dealing state is session-sealed and witness-fenced
  choice: '(b) and (r3). The binding choices: 1. **Where state lives.** `σ_i` stays in tier 0 under `K_tpm` (D-004: SS-074
    to SS-077, SS-079, SS-097). The shares of `x_f` and the private epoch keys live in session `keys`. The committee slots
    of an epoch live in the sequential pool `slots-e`. The ECDSA committee slot shares of one address live in an account pool
    named by a random id, so a record header shows no account. Request state lives in session `requests` as a cache that the
    node checks against the board. Shares of `κ_0` are not sealed: the board holds their dealing. Sessions are bound to one
    seat, and the session key comes from the threshold PRF only (D-001: SS-006, SS-007, SS-012, SS-014, SS-017. D-003: SS-007,
    SS-009, SS-011, SS-110). DESIGN §2.2, §3.6, §4.1, §7.4. Claims C12, C16. 2. **One committee pool per suite and epoch.**
    One shared index space would let the floor pass over the unreserved slots of the less used suite, and those slots would
    be lost. The checkpoint therefore shows the suite of each pool. The witness `slot` key is `(node, purpose, ℓ)`, with the
    purpose naming suite and epoch, which keeps the content of entry 50 item (4) (SS-050). DESIGN §4.1, §7.7, §6.4 item 16.
    Claim C10. 3. **Slot states and the bind.** A slot is `free`, `bound(H(tk))` or `burned`, and only moves forward. Binding
    gets `w` acks for the `slot` entries, then seals the `bound` state, before any partial leaves. A node binds every slot
    of one pool session that one board height anchors in one batch, so a release waits for two bind rounds whatever the number
    of slots (owner ruling 2026-11-14: use the batched design). seald binds a batch of slots in one call (SS-140, SS-141),
    and its cost is O36. A restored `bound` slot releases only for the same ticket. `slot_burn` at FINAL, VOID or EXPIRED
    is the erasure (SS-050 to SS-062, SS-118). DESIGN §4.5 items 4 to 6, §5.11, §7.6 to §7.8. Claims C5, C12. 4. **Reservation
    window at the vote.** Indices are reserved in increasing order. A header names only indices in `(h, h + B]` of the latest
    checkpoint or pending indices of its own request. Honest nodes vote under this rule, and seald enforces it again at `slot_bind`.
    A skipped index is lost (D-006: SS-063 to SS-066. D-011: SS-063, SS-064. D-009: SS-004, SS-088. D-030: SS-004, SS-063,
    SS-067). This makes DESIGN §4.1 consistent with SS-064 and answers Sessions open question Q-001. A header with an index
    at or below `h` that is not pending ends VOID with SLOT_TAKEN. DESIGN §2.3, §4.1. Claims C12, C13. 5. **Whole-committee
    restart.** The node classifies from one verified ledger snapshot: fewer than `w + 1` continuous seats (D-005: SS-067,
    SS-098, SS-106). Boot counters come only from signed `RestoreDone` (D-014: SS-112, SS-117). The restart burns the window
    `(h, h + B]` and the pending slots of each checkpoint read, and the requests that hold them end VOID (D-002: SS-063, SS-064,
    SS-067, SS-068, SS-104, SS-113, SS-114. D-031: SS-067, SS-068, SS-104). Running nodes burn too (D-021: SS-113, SS-120).
    The contract enforces the checkpoint rules (D-013: SS-103, SS-104, SS-117, with the root chain of SS-072, SS-119 and SS-136).
    DESIGN §7.11, §7.13, §14.3. Claim C16. 6. **Account pools.** Every `free` and `bound` account-pool slot burns once per
    whole-committee restart (D-018: SS-004, SS-063, SS-065, SS-114). The restart marker `restart_seq` and each session''s
    `restart_mark` carry that burn to nodes that boot later (D-024: SS-002, SS-005, SS-008, SS-069, SS-112, SS-120 to SS-125).
    A restart generation ends at a checkpoint with the marker and `w + 1` continuous seats (D-028: SS-113, SS-133). A put
    entry in the seat log, once a checkpoint root covers it, stops a second put of one share, and the first covered entry
    of a share counts (D-027: SS-128 to SS-131, SS-136 to SS-138, SS-089, SS-090). DESIGN §3.6, §4.5 item 7, §7.4, §7.11,
    §7.13. Claims C12, C16. 7. **The count `c` of the witness bound.** A seat with a lost tier 0 counts among the `c` colluders
    until its fetch from `w + 1` peers completes. A rolled-back seat counts for a session until a later version commits (D-025:
    SS-102, SS-126, SS-127. D-026: SS-102, SS-016. D-012: SS-102). This closes review finding B-F3. DESIGN §7.4, §7.7. Claims
    C5, C12. 8. **Recovery reshare of ECDSA slots (r3).** A reshare gives new share bytes with the same nonce `R_ℓ`, so the
    put entry (SS-128 to SS-131, SS-137, SS-138) and a new index both fail to stop a second use. A board record with valid
    QCs can be a truncated prefix, so (r1) fails after a rollback of every disk. (r2) has no referent: account pools have
    no floor on Midnight. Under (r3) `E` holds ECDSA shares only on a committee with seald''s `slot_anchor` on, keeps the
    slot key of each seat and the slot-nullifier key `k_nf` with them, reads each seat log up to the root of the latest checkpoint,
    and reshares a slot that no covered binding names. A log that `E` cannot read in full counts as binding every slot of
    its seat. Without anchors every ECDSA address refills by a new session. No per-slot Midnight record is needed (SS-070
    to SS-073, SS-092, SS-119, SS-139; root chain SS-072, SS-136). DESIGN §2.2, §3.9, §5.8, §7.11. Claims C15, C16. 9. **Body
    and size.** The session body has one canonical encoding, and `S_max` limits its accounted size (D-029: SS-134, SS-135,
    SS-088). DESIGN §2.3. 10. **seald rules that DESIGN takes as they stand.** Epoch close waits for every session of any
    seat in that epoch (D-023: SS-078 to SS-080), DESIGN §7.8. Peers check the app image before a session partial (D-019:
    SS-110), and version reports carry the seat''s signed statement (D-017: SS-111), DESIGN §7.4. Session operations run one
    at a time (D-020: SS-107, SS-023), DESIGN §7.7. Restore authenticates first and seals a new version, and a split version
    restores by plurality (D-015: SS-030, SS-031, SS-033 to SS-036. D-016: SS-031, SS-032). `session_close` discards changes
    without a checkpoint (D-007: SS-047). The refusal order (D-008: SS-089 to SS-091), the 4 MiB peer line (D-010: SS-109,
    DESIGN §14.1) and the deletion of covered `slot` entries from tier 0 (D-022: SS-108) need no DESIGN text. 11. **Midnight
    takes roots, not events.** Puts, slot bindings, release anchors of `anchor_before_release` charters, the slot entries
    of `slot_anchor` and `RestoreDone` statements go to an append-only seat log on the board. Each Midnight checkpoint carries
    one Merkle root per seat over that log, and the new `RestoreDone` statements. An entry counts once a landed root covers
    it. Checkpoint signers refuse a root over a log with a second binding for one slot key or a second put of one digest.
    Authority: owner ruling 2026-11-14, "use the batched design you are insane to make that many commits to midnight save
    space, tokens, and transactions", with the standing rule of no per-event Midnight writes. The Veritee requirements: put
    rules SS-128 to SS-131, SS-137 and SS-138; anchors SS-070 to SS-073, SS-092, SS-119 and SS-139; `RestoreDone` SS-112,
    SS-117 and SS-120 to SS-122; the root chain SS-136; the batched bind SS-140 and SS-141 (O36). DESIGN §4.1, §7.4, §7.7,
    §7.13, §11.6, §14.3, O32. Claims C12, C16. 12. **P2 seizure on ECDSA after a restart.** Without anchors the guardian slots
    `G_g` burn at a whole-committee restart, and their refill session needs the user online. A user who stays offline delays
    seizure until a refill runs. DESIGN §5.8.'
  rationale: 'Considered options: (a) Keep RAM only and rely on `E` at every whole-committee restart. (b) Map each class of
    state onto a seat-bound session, with the Sessions burn rules, as below. (c) Make sessions portable between seats. D-001
    rejects it: two shares in one enclave weaken the threshold. For the recovery gap: (r1) `E` reshares the ECDSA slots unclaimed
    on a board record with valid QCs; (r2) `E` burns every slot above a floor and reshares under new indices; (r3) `E` reshares
    an ECDSA slot only when Midnight shows that no seat bound it, which needs seald''s slot anchors, and otherwise reshares
    none.'
  authority: Lead decision adopting seald Sessions (Veritee branch committee-sessions) under owner delegation, 2026-11-14.
