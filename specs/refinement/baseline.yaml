  title: The frame carries a fixed authenticated layout block, and every actor capsule has one size
  choice: '(d). The layout holds 24 big-endian 2-byte lengths: `body_0`, 15 body regions and 8 capsule regions, with zero
    for each unused entry. `lay` is 64 bytes in every frame. `k_lay` is a separate HKDF purpose of the combined `Z_hdr`, so
    each key still encrypts one message under the zero nonce, and the node needs no extra partial. `lay` is inside `hd` and
    outside `dd`. A contribution frame carries a layout of the same size with zero body and capsule lengths. The actor capsule
    holds `k_hdr`, `k_lay`, the position, `τ_a` and eight capsule keys, unused ones zero: 385 bytes. Authority: lead decision
    under owner delegation, 2026-11-14.'
  rationale: 'Considered options: (a) Keep the trial scan. (b) Put the region lengths in the public part. This shows `K`,
    `L` and `G` before the QC and breaks the blind ordering of §4.6. (c) Put the lengths at the start of the header plaintext.
    The node must still find the end of the header ciphertext, so the scan stays. (d) A fixed-size block `lay = AEAD(k_lay,
    layout)` after the outer dealing, with `k_lay = KDF(Z_hdr ‖ "layout")`, and actor capsules padded to `K_max = 8` capsule
    keys.'
