  title: The target is armed by `n' − f'` READY posts and a heartbeat under `X_f`; Midnight decides activation or abort by
    a deadline
  choice: (a). `HANDOFF.md` §2.4, §2.6, §7.2 and §7.3; DESIGN §8.1; HO-029 to HO-035, HO-064 to HO-067. Lead pick, for owner
    confirmation.
  rationale: 'Considered options: (a) After `n'' − f''` READY posts for one qualified set and snapshot, a closed complaint
    window and no open restart, `t''` target seats sign an arm heartbeat under `X_f` per curve over a domain-separated message.
    The board block that commits it is `H`, and the source epoch casts no block vote above `H`. The activation record must
    land by the Midnight height `m_D`. Without it the rotation aborts and the source epoch resumes at `H + 1`. The epoch in
    grace keeps its shares, and a ROTATE with that epoch as its source replaces a committee of epoch `e + 1` that cannot sign.
    (b) READY posts alone, with HANDOVER ordered by the old leader. Rejected: it shows claims, not `t''` live holders, and
    it leaves the last step to the outgoing committee. (c) `q''` READY posts. Rejected: it leaves as few as `q'' − f''` honest
    holders, fewer than `t''`. (d) A deadline in board height. Rejected: a board that stops also stops its clock, and the
    two committees could read different outcomes.'
