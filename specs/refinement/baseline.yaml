  title: The commitment list starts with the initiator's leaf id
  choice: '(a). DESIGN §4.2 item 3 and its binding paragraph, row C19 and row O20. New requirement SH-038. The prototype (`impl/src/split/schnorr.rs`,
    `Request::transcript`) hashes the initiator''s leaf id before `R_0` for BIP340 and Ed25519. ECDSA has no `CL`: a slot
    is bound to one leaf set (§3.6 step 7). Lead pick, for owner confirmation.'
  rationale: 'Considered options: (a) `CL = leaf_0 ‖ R_0 ‖ …`, with `leaf_0` the initiator''s leaf id. `CL` then names every
    leaf of `S`, so it fixes `S` and every weight. (b) Hash the weight `λ_a` itself into `ρ_a`. Not chosen: it fixes the weight
    of one actor and leaves the set open, and (a) binds the same value with no new encoding of a field element. (c) Hash the
    whole header, which names `S`. Not chosen: every `ρ_a` would then depend on header fields that do not bear on the signature,
    and a re-post with one changed header field would change every binding factor. (d) Keep `CL` and rely on the one-answer
    rule. Rejected: the binding factor then misses the stated input condition of the assumption that O20 reduces to, and a
    pool restored from a backup answers a pair again.'
