- id: D-042
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Nonce agreement rests on board safety; `slot_anchor` for `|C| < t`
  choice: (a) as the default, stated in §4.1, C5, C9, C12, C20 and R2; (c) as a committee-wide option, open item O32. A per-charter
    option would not help, because `x_f` is shared by every address. TEE mode keeps `|C| < t` while the enclaves hold and
    at most `n − 1 − 2f` operators roll back or clone (§7.7), because enclaves sign board votes and never sign two blocks
    at one height.
  rationale: 'Considered options: (a) state the adversary of the slot rules as `|C| ≤ f` in non-TEE mode; (b) raise a release
    quorum so two quorums meet in an honest node at `|C| < t`, which needs `q'' ≥ (n + t)/2 = 8` against liveness `q'' ≤ n
    − f = 7`, impossible at launch; (c) append the slot-to-ticket entry to the seat log and release only after a Midnight
    checkpoint root covers it (`slot_anchor`), which restores `|C| < t` at one checkpoint interval plus Midnight finality
    per generation and no Midnight transaction of its own; (d) withdraw slot sharing, which does not help, because forks also
    give two requests one slot.'
