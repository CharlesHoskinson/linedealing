- id: D-069
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: The split-line mapping takes the Sessions records D-032 to D-045
  choice: '(a). The bindings: 1. **Roots per checkpoint and the slot anchor** (D-032, D-033: SS-070 to SS-073, SS-139). Midnight
    takes one root per seat per checkpoint. A slot-anchor binding is the entry `(nf, e)`: the slot nullifier under `k_nf`
    and the hidden digest. The enclaves derive `k_nf` once at genesis, and a rekey carries it. DESIGN §2.2, §4.1, §7.7, §7.13;
    CP-016. 2. **Pending fields and the batch bind** (D-034, D-035: SS-063 to SS-066, SS-140, SS-141). DESIGN takes them as
    they stand (§4.1, §7.7). 3. **Rekey of a closed session** (D-036: SS-143, SS-144). DESIGN §7.8. 4. **Lost `RestoreDone`**
    (D-037: SS-145). The node keeps the statement in RAM and appends it again. DESIGN §7.4, §7.11; CP-042. 5. **Rollback before
    the share install** (D-038). A limit, no rule. DESIGN §7.11 item 2. 6. **Pending floor and marker jump** (D-039: SS-146,
    SS-147). The contract refuses a checkpoint that lowers `pending_min`, and a checkpoint that moves `restart_seq` jumps
    the window as the first checkpoint after a restart does. The marker moves at the first checkpoint that carries, or follows
    a checkpoint that carries, a qualifying `RestoreDone` (SS-121). The loss bound of C16 grows by one window per seat that
    syncs after a rollback of every disk. DESIGN §7.11, §7.13 ("Why `pending_min` is enough" item 6), C16; CP-011, CP-039,
    CP-040, CP-041. 7. **Running-node burn** (D-040: SS-113, SS-114, SS-133). A running node burns its open sessions in RAM,
    and the next seal records the burn. An account pool burns once per restart generation. DESIGN §7.11; CP-021, CP-022. 8.
    **Statement encoding** (D-041). `RestoreDone` is 117 bytes with a u32 node index. DESIGN §7.13 and §11.6: 117 B per seat,
    at most 1,053 B at `n = 9` and 1,989 B at `n = 17`; CP-016. 9. **Later unverified ledger view** (D-044: SS-066, SS-106,
    SS-137). The node keeps the last verified view. DESIGN §7.11; CP-043. 10. **Taken as they stand**, with no DESIGN text:
    the u32 share length with its maximum of 524,288 bytes (D-042: SS-087), the u64 versions that refuse at exhaustion (D-043),
    and `bad_request` before `fenced` and `not_ready` for a malformed batch item (D-045: SS-081 to SS-083, SS-141). 11. **Account-pool
    burn without a slot list** (prototype finding PR4). A node finds its account pools among its sessions: the session `keys`
    maps each ECDSA address to its pool id, and its local records and witness sync entries name every session of the seat.
    The burn takes every slot of each pool, so it needs no list of named slots. DESIGN §7.11; CP-021. Authority: lead decision
    under owner delegation, 2026-11-15 (item 25). It takes the Veritee lead decisions D-032 to D-045, made under owner AFK
    delegation.'
  rationale: 'Considered options: (a) Take each record into DESIGN and the checkpoint spec where it changes state or a size
    that DESIGN states, and list the others as taken as they stand. (b) Rewrite entry 51. Rejected: earlier entries stay as
    written (LOOP rules).'
  authority: Lead decision under owner delegation, 2026-11-15 (Sessions records D-032 to D-045, item 25).
