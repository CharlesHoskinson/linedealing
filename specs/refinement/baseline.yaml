    structure, distinct points, the TEE recomputation and the contribution frames. Item 5 is the admission check, run once
    the authorization is in force: `auth` commits to `hd` and `tkc` (AUTH_REFUSED), and the request has precedence on every
    slot it names (SLOT_TAKEN). A header whose authorization never comes into force lapses by SL-005. (b) Hold the header
    closed until the authorization is in force. Rejected: it adds `F_M` to the open, and §11.2 overlaps the two. (c) Keep
