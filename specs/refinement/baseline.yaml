- id: D-055
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: A FINAL or VOID post counts at its board position; the poster validates its evidence
  choice: '(c). An honest node posts FINAL(txid) only when its own chain view shows `txid` at the confirmation depth, and
    VOID only when it sees a foreign spend of the pin. The board records every authenticated FINAL or VOID post of a committee
    member at its position, and the tombstone forms at the first position where `f + 1` distinct members of one epoch have
    posted FINAL with one `txid` (SCHEME) or `q` FINAL votes with one `Enc_{k_fin}(txid)` (DESIGN §5.6), or `f + 1` VOID posts.
    FINAL before VOID is decided by board position. Authority: lead decision under owner delegation, 2026-11-14.'
  rationale: 'Considered options: (a) validate at arrival and drop for good (the old `impl/` rule); (b) keep the post and
    count it once the evaluator''s chain backs it, which needs a re-evaluation on every chain step and still depends on the
