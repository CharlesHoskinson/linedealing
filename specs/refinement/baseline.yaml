- id: D-054
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: ECDSA precedence starts at the authorization, and the slot rules of §4.1, §4.5, §4.6 and §5.11 agree
  choice: '1. §4.1 is the rule for committee slots: the request with precedence burns every named committee slot when it ends
    or lapses. §4.5 item 4 now says so, and adds the ECDSA rule of item 4. 2. A contribution frame carries 32 random bytes
    in `auth_ref`, as every envelope without an authorization. The definition `pub*` with `auth_ref` set to zero inside `hd`
    stays. 3. The §5.11 row states the leak of §3.6: the group''s shard, and `x` only with the halves of every other actor
    on the slot. 4. Option (b). An ECDSA slot is burned when a request that reserved it ends. §4.1, §4.5 item 4, §5.8, C13
    and the §9.3 row "C6, C13" carry it. New open item O38.'
  rationale: committee slot ids carry no account and are dealt to anyone, so the pool cost of spam is the bound that O34 sizes.
    An ECDSA slot belongs to one address and is refilled only with every session party online, so a burn by an outsider is
    a denial of service on that address. Only the record's own sources can have an authorization in force that opens its slot
    root, and Midnight accepts one `authorize` per `nf`. A copy of a header therefore takes no ECDSA slot under (b). A slot
    that no request reserved holds no partial, because no node releases before the authorization is in force (C6). It needs
    no burn.
  authority: Lead decision under owner delegation on branch quint-split (Quint findings and paper review), 2026-11-14. Not
    merged to main.
