  title: A checkpoint needs `t` signers, not `q`
  choice: (a). DESIGN §7.13 and §11.6; CP-003; HO-050 and HO-068. Board certificates (birth, acknowledgement, slot roots,
    VOID leaves) keep `q`, because they attest board facts, not the ability to sign. Lead pick, for owner confirmation.
  rationale: 'Considered options: (a) Every checkpoint, the activation record included, needs `t` valid signatures of its
    epoch''s key set. (b) Keep `q` and add a heartbeat under `X_f` to each checkpoint. Not chosen here: item 42 owns the heartbeat
