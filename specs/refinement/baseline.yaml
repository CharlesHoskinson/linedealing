    the governance key set of the latest landed checkpoint. It names the target roster, parameters, source epoch and an emergency
    flag. A ROTATE whose preconditions do not hold is QUEUED and starts when they hold. No charter, profile, suite or mode
    takes part. (b) Any committee node may post ROTATE. Rejected: one hostile node could rotate at will or flood the board
    with rotations. (c) The Image Registry governance of 7 of 9 separate members approves rosters. Rejected: the owner rule
    names the rotated Fenrir operator keys, and an image approval is a different decision from a roster. (d) A charter opts
    in to rotation. Rejected by the owner ruling: an address that cannot follow a handoff pins the keychain. (e) Refuse a
