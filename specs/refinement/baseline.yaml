- id: D-056
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: After HANDOVER each committee that served a request counts its own FINAL and VOID posts
  choice: '(c). A FINAL or VOID post counts when its author is a member of an epoch that serves the request: the binding epoch,
    or a successor epoch from the board position of the ROTATE that registers it, before or after HANDOVER, until that epoch''s
    post keys expire with the grace period. A post under an epoch that is not registered at its position cannot be authenticated
    and is refused. VOID counts distinct members whatever foreign txid each reports, because the pin is spent once. Each epoch''s
    posts are compared with that epoch''s own `f + 1` (or `q`). Posts of two epochs are never added together, because `f`
    Byzantine nodes of one epoch and `f''` of the next could otherwise reach a threshold with no honest post. Authority: lead
    decision under owner delegation, 2026-11-14.'
  rationale: 'Considered options: (a) count old-committee posts only while it has a generation in flight (the old `impl/`
    rule); (b) count every post of any epoch in one set; (c) count each epoch that served the request against its own threshold,
    at any time, never adding posts across epochs.'
