questions:
- id: Q-001
  blocks_readiness: false
  decision_owner: lead
  question: 'DESIGN names VOID cases without a reason code: malformed header (§5.4), dealer fault, foreign spend of the pin
    in TEE mode (§5.6), whole-committee restart (§7.11). The specs use MALFORMED, DEALER_FAULT, PIN_SPENT and RESTART.'
  alternatives:
  - adopt the four codes in DESIGN §5.1
  - fold them into one code
  affected:
  - RQ-014
  - RQ-015
  - RQ-041
  - RQ-048
  - RQ-065
  reason: Codes are wire values; models need distinct values to trace refusals. Safety does not depend on the names.
- id: Q-002
  blocks_readiness: false
  decision_owner: lead
  question: Which reason a VOID tombstone carries when its f + 1 posts name different reasons. The specs take the reason of
    the completing post.
  alternatives:
  - reason of the completing post
  - reason of the first post
  - a fixed priority order
  affected:
  - RQ-045
  reason: The outcome (VOID or RELEASED) does not depend on the reason.
  status: resolved
  resolution:
    decision: The tombstone reason is the reason that at least f + 1 of the counted posts carry; if none reaches f + 1 the
      reason is MIXED (RQ-045, RQ-072), and no rule reads MIXED as STALLED, SLOT_TAKEN or REVOKED (RQ-071, RQ-063, AU-019,
      AU-021).
    reason: 'Item 14 finding F2: with the completing post''s reason a corrupt member chose the reason, REVOKED in a P1 charter
      and STALLED on a request that released, against C13 and C20. With f + 1 posts every named reason has an honest post.'
    authority: lead decision, DECISIONS 61
    requirement_refs:
    - RQ-045
    - RQ-072
    - RQ-071
    - RQ-065
    - RQ-063
    - AU-019
    - AU-021
- id: Q-003
  blocks_readiness: false
  decision_owner: lead
  question: A node judges a header's committee slot precedence only after every earlier-ordered live envelope has opened or
    ended. DESIGN §4.1 orders precedence by board position and is silent on the wait.
  alternatives:
  - wait for earlier headers (specs)
  - judge at open and revise on SLOT_TAKEN
  affected:
  - SL-004
  - CON-001
  reason: Without the wait two nodes can judge one slot differently; impl/ refuses with EarlierHeader, which matches.
- id: Q-004
  blocks_readiness: false
  decision_owner: lead (merge of branch quint-split)
  question: DECISIONS 53 and 54 and their DESIGN hunks exist only on branch quint-split. The specs follow them.
  alternatives:
  - merge quint-split into main
  - rewrite the specs to the main text
  affected:
  - D-053
  - D-054
  - RQ-052
  - SL-006
  - SL-007
  - SL-011
  - EN-015
  - SH-018
  reason: DESIGN on main still burns ECDSA slots of an unauthorized namer and settles a restart end VOID. The lead decided
    both on quint-split; main must catch up before the oracle is accepted.
- id: Q-005
  blocks_readiness: false
  decision_owner: lead (measurement, DESIGN §11)
  question: Values of the reservation window B, the ECDSA window B_slot and the session size bound S_max.
  alternatives:
  - measure under heavy-slot --exclusive
  affected:
  - SL-012
  - CON-004
  reason: The specs and models use the symbols; the deployment picks the numbers.
- id: Q-006
  blocks_readiness: false
  decision_owner: lead
  question: DECISIONS 53 lacks Drivers and Considered options fields; its D item carries them from the entry text until the
    record is completed on merge.
  alternatives:
  - add the fields on the quint-split merge
  affected:
  - D-053
  reason: Documentation only; the obligations and confirmation of 53 are stated.
- id: Q-007
  blocks_readiness: false
  decision_owner: lead
  question: DESIGN §4.2 says the actor 'may refuse' a request. OpenSpec strict needs SHALL or MUST, so SH-023 states a SHALL
    refusal conditioned on the actor's own policy and names the code policy_refused, which DESIGN does not name.
  alternatives:
  - keep the SHALL-on-policy form, with the policy as a free model input
  - state the MAY cell outside the OpenSpec capability
  affected:
  - SH-023
  reason: The models take the policy as a free input either way; the code is a wire value.
  status: resolved
  resolution:
    decision: Keep SH-023 as a SHALL refusal conditioned on the actor's own policy, with the policy a free model input and
      the code policy_refused.
    reason: OpenSpec strict needs SHALL or MUST; the condition on the actor's own policy keeps the 'may refuse' meaning of
      DESIGN §4.2.
    authority: lead decision, LOOP item 12
    requirement_refs:
    - SH-023
- id: Q-008
  blocks_readiness: false
  decision_owner: lead
  question: DESIGN §5.6 and §7.11 say a whole-committee restart also ends again a request that ended after the latest landed
    checkpoint, and DECISIONS 53 settles every request the restart ends as FINAL or RELEASED. RQ-048 sets restart_end only
    for a live request whose slot the restart burns, and RQ-005 refuses events on a terminal request, so the re-end of an
    already terminal request has no requirement.
  alternatives:
  - add a requirement that re-settles a terminal request whose slot the restart burns and whose settlement no landed root
    covers
  - state that CP-030 and CP-033 settle those requests directly
  affected:
  - RQ-005
  - RQ-048
  - RQ-052
  - RQ-068
  - D-053
  reason: C11 across a restart depends on it; the oracle and the model must pick one form before item 13 freezes the transitions.
  status: resolved
  resolution:
    decision: 'Add RQ-068: when a whole-committee restart burns a slot of a request that ended after the latest landed checkpoint,
      the restart ends that request again and its outcome follows the restart settlement rule of RQ-052 (DECISIONS 53). RQ-005
      excepts this re-end.'
    reason: DESIGN §5.6 and §7.11 say the restart ends such a request again; without the rule a VOID settlement in the lost
      board tail can return a released record to unspent and break claim C11.
    authority: lead decision, LOOP item 12
    requirement_refs:
    - RQ-068
    - RQ-005
    - RQ-048
    - RQ-052
    - RQ-054
