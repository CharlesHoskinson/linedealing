- id: D-019
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: Charter custody profiles
  choice: 'Every address carries a profile fixed at birth in its charter: - `P0 existing`: the original line dealing on an
    existing owner address. No Fenrir co-custody, no holds, no seizure (book level L0). - `P1 co-custody`: split-line dealing,
    user half plus Fenrir half. Covenant predicates and approver vetoes the owner chose apply; no seizure, no third-party
    freeze, no guardian escrow. Exit to the standing exit record is unconditional when Fenrir disappears (recovery group or
    exit leaf). - `P2 regulated`: P1 plus the charter''s seize, freeze, blacklist and hold entries, the guardian escrow G
    and the hold accumulator; exit is subordinate to a live hold. The protocol, envelope and committee state machine are identical
    across profiles; P2 only adds authorization sources and checks. Nothing in P0 or P1 depends on G, `D_reg` or the hold
    accumulator, and no P2 component is needed to run Fenrir.'
  rationale: 'Considered options: (a) seizure as a property of every address, as the brief first stated it; (b) per-charter
