  title: One activation record, signed by the armed committee alone, switches the Midnight authority, and every committee
    signature is scoped to its epoch
  choice: (a). `HANDOFF.md` §5 and findings A3 to A5, A9 and A10; DESIGN §7.5, §7.13, §8.4 and §11.6; HO-046 to HO-053, HO-065,
    HO-067; CP-006 reworded. Lead pick, for owner confirmation.
  rationale: 'Considered options: (a) The activation record carries the checkpoint fields at the armed height `H`, `EKS_{e+1}`,
    the roster, the departing seats, the ROTATE with its governance signatures and the arm heartbeat under `X_f`, with `t''`
    signatures of the target epoch and none of the source epoch. The contract accepts it until the Midnight deadline `m_D`.
    After it lands the contract accepts only the new epoch''s checkpoints. Every committee certificate names its epoch and
    is checked against that epoch''s key set while the epoch is current or in grace. `authorize` checks no committee signature.
    (b) A handover checkpoint signed by `q` seats of each epoch. Rejected: the outgoing committee could refuse its signatures
    after the incoming one is armed, which blocks the handoff and differs from a recovery. (c) Separate `rotate`, `EKS`, `retire`
    and `replaceSlot` writes. Rejected: four kinds of write per handoff where one serves, against the batching rule. (d) Check
    certificates against the current key set only. Rejected: a refill finished just before the activation and a reissue of
    a VOID leaf just after it would fail with no fault of the user.'
