- id: D-080
  version: 1
  state: provisional
  basis: explicit
  source_refs:
  - SRC-002
  title: The binding epoch owns its requests through grace, and a sweep carries the live ones
  choice: (a). `HANDOFF.md` §2.3, §2.5, §4; DESIGN §8.2; HO-025 to HO-027, HO-036 to HO-044, HO-059. Lead pick, for owner
    confirmation.
  rationale: 'Considered options: (a) The epoch whose keys an envelope names owns the request until a sweep before its grace
    end. After the arming its members post their request entries as signed epoch posts. At the sweep, the live material (`κ_0`,
    `κ_c`, P0 lines, unreleased slots) of each live request is carried to the successor, which owns the request from the position
    where `n'' − f''` new seats are ready for the sweep. From ROTATE to CLOSE every release is committed on the board first,
    and each carry lists the witnessed releases, so RELEASED settlement survives. (b) Freeze admissions at a cut-over height
    and let the old committee finish the admitted requests. Not chosen: requests ordered but not yet admitted at the cut-over
    (authorization not final, collection open) still need either the old committee or a carry, and lagging wallets keep binding
    the old epoch. (c) Switch every request to the new committee at the activation and carry the live material of every live
    request then. Rejected: the requests waiting for admission at that moment are about the request rate times the admission
    latency, at about 31 KB each at `n = 9`, a burst near the whole board bandwidth. (d) VOID and re-post, as before. Rejected
    by the owner rule. (e) Re-deal the request onto new-epoch slots. Rejected: the user''s contribution fixes `R` and `c`,
    and a committee that signs without a new contribution breaks C3.'
  authority: 'Lead pick, for owner confirmation, 2026-11-16 (committee handoff, item 41), inside the owner rulings of 2026-11-16:
    the user''s shard stays unchanged, and the protocol must permit key rotation.'
