- id: D-081
  version: 1
  state: provisional
  basis: explicit
  source_refs:
  - SRC-002
  title: 'Every epoch ends in a handoff: 7 days, at most `⌊f/2⌋` seats scheduled and `f` in an emergency'
  choice: (a). `HANDOFF.md` §3.3 and §7.5; DESIGN §2.3 and §8.1. The grace period becomes 2 days of Midnight blocks after
    the activation in place of "1 epoch boundary + 2 days". Lead pick, for owner confirmation.
  rationale: 'Considered options: (a) One handoff per epoch of 7 days (`Δ_rot = 5` days plus `Δ_grace = 2` days after the
    activation), which is a refresh when no seat changes. Every clock counts Midnight blocks: a day is the number of Midnight
    blocks in a day. A scheduled rotation replaces at most `⌊f/2⌋` seats, an emergency rotation at most `f`. Carries take
    at most `β = 10 %` of board bytes per block. (b) Rotate only when the roster changes. Rejected: shares of one sharing
    would accumulate exposure for months, and a stolen share would stay useful. (c) Enroll a joining seat at a new index of
    the same polynomial by share repair. Not chosen: it costs about `t` scalars per secret in place of a full reshare, but
    every departed seat''s share stays a valid point of the live sharing. (d) Allow up to `f` seats in a scheduled rotation.
    Rejected: it leaves no fault budget for a joining or departing seat that fails during the rotation.'
