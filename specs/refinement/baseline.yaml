  title: A network-created shard is born unacknowledged; the holder acknowledges with a proof of possession under `X_u`, and
    a payer funds only an acknowledged address
  choice: '(b). The acknowledgement reuses the birth data and the proof of possession of §3.1 step 3, so an extractor obtains
    `x_u`, and C1 holds for an acknowledged shard. New requirements SH-030 to SH-037; SH-008 and SH-011 cite this entry. DESIGN
    §3.1, §4.6, §5.7, §6.4 item 13, §11.6, C1. Authority: lead decision under owner delegation, 2026-11-15 (item 17a).'
  rationale: 'Considered options: (a) A proof at birth that the ciphertext of the record decrypts to the `e_c` behind `δ`.
    It needs `e_c·U`, `Hq_st`, `δ·G` and a verifiable decryption on secp256k1 inside a circuit. Rejected: DESIGN keeps curve
    arithmetic out of circuits, and the birth check runs at the nodes, where no Midnight proof system runs. (b) A holder acknowledgement.
    The record is born with `acked = false`. The holder, once online, derives `x_u`, checks `x_u·G = X_u`, and sends an `ACK`
    envelope (request type 0x07) with `pop_u` under `X_u`. `q` nodes sign `ACK_OK`, the holder''s `acknowledge` call sets
    `acked = true`, and a payer wallet pays only to an acknowledged address. (c) The creator proves the encryption by showing
    `e_c` to the nodes. Rejected: `e_c` and `U` give `x_u − u`, so the nodes would learn a relation of the holder''s keys.'
