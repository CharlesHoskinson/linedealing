- id: D-064
  version: 1
  state: confirmed
  basis: explicit
  source_refs:
  - SRC-002
  title: A request with a committed RELEASE never takes reason STALLED; late admission stays allowed
  choice: '(a). With a STALLED post among the `f + 1` posts of the tombstone, the remaining posts are at most `f`, so the
    reason is MIXED; a tombstone of `f + 1` posts without a STALLED post keeps the reason of entry 61. Authority: owner ruling,
    2026-11-15 (item 14 finding F6). It replaces the lead''s first rule (option (b)), which was not committed.'
  rationale: 'Considered options: (a) Keep late admission. Once `any_release = true`, a STALLED post of the request counts
    toward the `f + 1` posts that form the VOID tombstone but not toward its reason. The reason is the reason that `f + 1`
    of the remaining posts carry, otherwise MIXED. A request with `any_release = true` never has reason STALLED (new RQ-073
    and RQ-074; RQ-045 and RQ-072 count reason posts). (b) Close admission at `exp_c`: no ADMIT vote at or after `exp_c`,
