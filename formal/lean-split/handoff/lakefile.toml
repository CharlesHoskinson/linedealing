name = "split_handoff_oracle"
defaultTargets = ["SplitHandoff", "oracle"]

# Every module under SplitHandoff/ (Spec, Tests, Audit) is built by default, so
# `lake build --wfail` sees a `sorry` in any of them.
[leanOptions]
autoImplicit = false

[[require]]
name = "split_codec"
path = "../codec"

[[lean_lib]]
name = "SplitHandoff"
globs = ["SplitHandoff.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
