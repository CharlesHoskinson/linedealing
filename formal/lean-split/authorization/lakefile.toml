name = "split_authorization_oracle"
defaultTargets = ["SplitAuthorization", "oracle"]

# Every module under SplitAuthorization/ (Spec, Tests, Audit) is built by default, so
# `lake build --wfail` sees a `sorry` in any of them.
[leanOptions]
autoImplicit = false

[[require]]
name = "split_codec"
path = "../codec"

[[lean_lib]]
name = "SplitAuthorization"
globs = ["SplitAuthorization.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
