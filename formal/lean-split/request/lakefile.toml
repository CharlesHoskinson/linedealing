name = "split_request_oracle"
defaultTargets = ["SplitRequest", "oracle"]

# Every module under SplitRequest/ (Spec, Tests, Audit) is built by default, so
# `lake build --wfail` sees a `sorry` in any of them.
[leanOptions]
autoImplicit = false

[[require]]
name = "split_codec"
path = "../codec"

[[lean_lib]]
name = "SplitRequest"
globs = ["SplitRequest.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
