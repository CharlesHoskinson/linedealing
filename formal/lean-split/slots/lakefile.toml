name = "split_slots_oracle"
defaultTargets = ["SplitSlots", "oracle"]

# Every module under SplitSlots/ (Spec, Tests, Audit) is built by default, so
# `lake build --wfail` sees a `sorry` in any of them.
[leanOptions]
autoImplicit = false

[[require]]
name = "split_codec"
path = "../codec"

[[lean_lib]]
name = "SplitSlots"
globs = ["SplitSlots.+"]

[[lean_exe]]
name = "oracle"
root = "Main"
supportInterpreter = false
