# EARS IDs of split-request that no rule of the KRS definition stands for, so no
# mutation can name them, and the check that covers each instead. The `mutations` gate
# (scripts/check_mutations.py) fails on an ID that is neither here nor named by a mutation.
#
# The node rules ("the committee node SHALL") are branches of the oracle's `nodeAct`,
# which only the oracle's `--step` mode runs (a `{"node": ...}` line). A kink program
# runs board events only, so the KRS definition has no node rule.

