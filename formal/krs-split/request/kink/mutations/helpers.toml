# Misreadings of the helper functions, the record readers and writers, and the terminal and
# guard checks that the event misreadings leave alone. Every equation of the definition is a
# mutation target, so each equation no other file edits has one here.

[[mutation]]
id = "h-step-open-guard"
expect = "kill"
misunderstanding = "RQ-005, RQ-056: a header for a FINAL, VOID or EXPIRED request is applied as for a live one"
  [[mutation.edit]]
  rule = "split_request--step_open_1"
  find = "isTerminal ( getPhase ( R:Req ) )"
  replace = "false"
  [[mutation.edit]]
  rule = "split_request--step_open_2"
  find = "isTerminal ( getPhase ( R:Req ) )"
  replace = "false"

