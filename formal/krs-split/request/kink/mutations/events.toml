# Plausible misreadings of the events that name a request (RQ-005 to RQ-029, RQ-042 to
# RQ-044, RQ-048 to RQ-068), as K patches of kink/definition.k.

[[mutation]]
id = "order-not-stored"
expect = "kill"
misunderstanding = "RQ-006: an applied order event is observed with the request's phase, but the board keeps the old record"
  [[mutation.edit]]
  rule = "order"
  find = "replace ( Eid:Int ,"
  replace = "replace ( 0 -Int 1 ,"

[[mutation]]
id = "order-refused-no-rule"
expect = "kill"
misunderstanding = "Ledger 1, RQ-006: a refused order event lists no-rule with its spec codes"
  [[mutation.edit]]
  rule = "order-refused"
  find = "ListItem(refused ( resCodes ( tOrder ("
  replace = "ListItem(refused ( ListItem(rfNoRule) resCodes ( tOrder ("

