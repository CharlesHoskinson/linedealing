[[mutation]]
id = "order-code-order"
expect = "kill"
misunderstanding = "RQ-005, RQ-007: terminal goes before no_qc"
  [[mutation.edit]]
  rule = "split_request--order_codes"
  find = "opt ( notBool Qc:Bool , rfNoQc ) opt ( isTerminal ( Ph:Phase ) , rfTerminal )"
  replace = "opt ( isTerminal ( Ph:Phase ) , rfTerminal ) opt ( notBool Qc:Bool , rfNoQc )"

[[mutation]]
id = "order-no-qc-ok"
expect = "kill"
misunderstanding = "RQ-007: a block without a quorum certificate orders the request"
  [[mutation.edit]]
  rule = "split_request--order_codes"
  find = "opt ( notBool Qc:Bool , rfNoQc ) "
  replace = ""

[[mutation]]
id = "order-exp-c"
expect = "kill"
misunderstanding = "RQ-006: exp_c = delta_c, not b + delta_c"
  [[mutation.edit]]
  rule = "split_request--step_order_1"
  find = "ctxHeight ( C:Ctx ) +Int ctxDeltaC ( C:Ctx )"
  replace = "ctxDeltaC ( C:Ctx )"

[[mutation]]
id = "order-again"
expect = "kill"
misunderstanding = "RQ-006, RQ-056: an order of an ORDERED request orders it again"
  [[mutation.edit]]
  rule = "split_request--order_codes"
  find = "Ph:Phase ==K phPOSTED"
  replace = "notBool isTerminal ( Ph:Phase )"

