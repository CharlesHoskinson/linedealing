  [[mutation.edit]]
  rule = "split_request--open_ordered_1"
  find = "getPhase ( R:Req ) ==K phORDERED"
  replace = "true"
  [[mutation.edit]]
  rule = "split_request--open_ordered_2"
  find = "getPhase ( R:Req ) ==K phORDERED"
  replace = "true"

[[mutation]]
id = "open-no-table"
expect = "kill"
misunderstanding = "RQ-013, RQ-018: the actor slot table of a collecting header starts with no position"
  [[mutation.edit]]
  rule = "split_request--open_header_1"
  find = "noneList ( Npos:Int )"
  replace = ".List"

[[mutation]]
id = "open-g-is-k"
