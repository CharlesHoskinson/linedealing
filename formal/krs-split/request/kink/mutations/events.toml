[[mutation]]
id = "complaint-until-q"
expect = "kill"
misunderstanding = "RQ-011, RQ-012: a complaint is early until q ADMIT votes commit, not until the first"
  [[mutation.edit]]
  rule = "split_request--complaint_ordered_1"
  find = "size(getAdmitVotes ( R:Req )) ==Int 0"
  replace = "size(getAdmitVotes ( R:Req )) <Int 3"
  [[mutation.edit]]
  rule = "split_request--complaint_ordered_2"
  find = "size(getAdmitVotes ( R:Req )) ==Int 0"
  replace = "size(getAdmitVotes ( R:Req )) <Int 3"

[[mutation]]
id = "complaint-posted"
expect = "kill"
misunderstanding = "RQ-011: a complaint against a POSTED request records early_complaint"
  [[mutation.edit]]
  rule = "split_request--complaint_live_1"
  find = "getPhase ( R:Req ) ==K phPOSTED"
  replace = "false"
  [[mutation.edit]]
  rule = "split_request--complaint_live_2"
  find = "getPhase ( R:Req ) ==K phPOSTED"
  replace = "false"

[[mutation]]
id = "complaint-late-early"
expect = "kill"
misunderstanding = "RQ-012: a complaint after the first ADMIT vote is recorded as an early complaint"
  [[mutation.edit]]
  rule = "split_request--complaint_ordered_2"
  find = "rOk ( setDealerFault ( R:Req ) )"
  replace = "rOk ( setEarly ( R:Req ) )"

[[mutation]]
id = "frame-held-ordered-only"
expect = "kill"
misunderstanding = "RQ-021: frames are held only for an ORDERED request; a POSTED request refuses them"
  [[mutation.edit]]
  rule = "split_request--frame_posted_1"
  find = "getPhase ( R:Req ) ==K phPOSTED"
  replace = "false"
  [[mutation.edit]]
  rule = "split_request--frame_posted_2"
  find = "getPhase ( R:Req ) ==K phPOSTED"
  replace = "false"

[[mutation]]
id = "frame-held-own-height"
expect = "kill"
misunderstanding = "RQ-021: a held frame keeps the height it carries, not the board height it was ordered at"
  [[mutation.edit]]
  rule = "split_request--frame_hold"
  find = "frameAt ( Fr:Frame , ctxHeight ( C:Ctx ) )"
  replace = "Fr:Frame"

[[mutation]]
id = "frame-position-last"
expect = "kill"
misunderstanding = "RQ-018: the last position of the actor slot table is outside it"
  [[mutation.edit]]
  rule = "split_request--frame_in_table_1"
  find = "framePos ( Fr:Frame ) <Int size(getPositions ( R:Req ))"
  replace = "framePos ( Fr:Frame ) +Int 1 <Int size(getPositions ( R:Req ))"
  [[mutation.edit]]
  rule = "split_request--frame_in_table_2"
  find = "framePos ( Fr:Frame ) <Int size(getPositions ( R:Req ))"
  replace = "framePos ( Fr:Frame ) +Int 1 <Int size(getPositions ( R:Req ))"

[[mutation]]
id = "frame-late-at-exp-c"
expect = "kill"
misunderstanding = "RQ-020: a frame ordered at exp_c is late"
  [[mutation.edit]]
  rule = "split_request--late"
  find = "<Int H:Int"
  replace = "<=Int H:Int"

[[mutation]]
id = "frame-code-order"
expect = "kill"
misunderstanding = "RQ-019, RQ-020: position_filled goes before late_contribution"
  [[mutation.edit]]
  rule = "split_request--frame_codes_1"
  find = "opt ( late ( getExpC ( R:Req ) , ctxHeight ( C:Ctx ) ) , rfLateContribution ) opt ( isSome ( getD ( getPositions ( R:Req ) , Position:Int ) ) , rfPositionFilled )"
  replace = "opt ( isSome ( getD ( getPositions ( R:Req ) , Position:Int ) ) , rfPositionFilled ) opt ( late ( getExpC ( R:Req ) , ctxHeight ( C:Ctx ) ) , rfLateContribution )"

[[mutation]]
id = "frame-filled-replaces"
expect = "kill"
misunderstanding = "RQ-019: a frame for a filled position replaces its contribution"
  [[mutation.edit]]
  rule = "split_request--frame_codes_1"
  find = "opt ( isSome ( getD ( getPositions ( R:Req ) , Position:Int ) ) , rfPositionFilled )"
  replace = ".List"

[[mutation]]
id = "frame-lengths-unchecked"
expect = "kill"
misunderstanding = "RQ-018: the contribution lengths are not checked"
  [[mutation.edit]]
  rule = "split_request--frame_codes_1"
  find = "TokenOk:Bool andThenBool LengthsOk:Bool"
  replace = "TokenOk:Bool"

[[mutation]]
id = "frame-token-unchecked"
expect = "kill"
misunderstanding = "RQ-018: the token is not checked"
  [[mutation.edit]]
  rule = "split_request--frame_codes_1"
  find = "TokenOk:Bool andThenBool LengthsOk:Bool"
  replace = "LengthsOk:Bool"

[[mutation]]
id = "held-any-height"
expect = "survive"
misunderstanding = "RQ-021, RQ-020: held frames attach whatever height they were ordered at. Argued survivor since the item 13 ruling (ledger 8: RQ-020 in every live phase): a frame is held only when it is not late, at POSTED (no exp_c yet; the later order sets exp_c = b + delta_c with b at or above the frame's height, as the board height never goes down) or at ORDERED with height <= exp_c. Every held frame has height <= exp_c, so the attach-time height check of attachHeld, kept because the oracle keeps it, never decides and no program tells the mutant apart"
  [[mutation.edit]]
  rule = "split_request--held_ok_1"
  find = "(Height:Int <=Int E:Int)"
  replace = "true"

[[mutation]]
id = "held-token-unchecked"
expect = "kill"
misunderstanding = "RQ-021, RQ-018: a held frame's token is not checked when it attaches"
  [[mutation.edit]]
  rule = "split_request--held_ok_1"
  find = "andThenBool TokenOk:Bool)"
  replace = "andThenBool true)"

[[mutation]]
id = "held-lengths-unchecked"
expect = "kill"
misunderstanding = "RQ-021, RQ-018: a held frame's lengths are not checked when it attaches"
  [[mutation.edit]]
  rule = "split_request--held_ok_1"
  find = "andThenBool LengthsOk:Bool)"
  replace = "andThenBool true)"

[[mutation]]
id = "held-later-replaces"
expect = "kill"
misunderstanding = "RQ-021: a later held frame for one position replaces the earlier one"
  [[mutation.edit]]
  rule = "split_request--held_ok_1"
  find = "(notBool isSome ( getD ( Ps:List , Position:Int ) ))"
  replace = "true"

[[mutation]]
id = "held-dropped"
expect = "kill"
misunderstanding = "RQ-021: held frames are dropped, not attached, when the request reaches COLLECTING"
  [[mutation.edit]]
  rule = "split_request--opened_count_1"
  find = "attachHeld ( orElse ( getExpC ( R:Req ) , 0 ) , getPositions ( R:Req ) , getHeld ( R:Req ) )"
  replace = "getPositions ( R:Req )"

[[mutation]]
id = "detach-keeps"
expect = "kill"
misunderstanding = "RQ-022: a detached frame keeps its position filled"
  [[mutation.edit]]
  rule = "split_request--detach_live_1"
  find = "getPositions ( R:Req ) [ Position:Int <- .List ]"
  replace = "getPositions ( R:Req )"

