  { Post = { eid = 2, epoch = 0, exp = 1000, rtype = "TyP0", profile = "PfP0" } },
  { Order = { eid = 2, qc = true, p = 0 } },
  { Open = { eid = 1, kk = 2, ll = 1, collecting = false, npos = 0, rates = [10, 20] } },
  { Open = { eid = 2, kk = 2, ll = 1, collecting = true, npos = 1, rates = [10, 20] } },
