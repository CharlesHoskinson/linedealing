[[mutation]]
id = "en014-first-t-padded"
expect = "kill"
misunderstanding = "EN-014: the first t partials are padded with a partial whose proof fails when exactly t are at hand"
  [[mutation.edit]]
  rule = "split_envelope--take_n_1"
  find = "=> .List"
  replace = "=> ListItem(partial ( 0 , false ))"

[[mutation]]
id = "en014-first-t-empty"
expect = "kill"
misunderstanding = "EN-014: the tag is checked over none of the partials"
  [[mutation.edit]]
  rule = "split_envelope--take_n_2"
  find = "=> ListItem(P:Partial) takeN ( T:Int -Int 1 , Rest:List )"
  replace = "=> takeN ( T:Int -Int 1 , Rest:List )"

[[mutation]]
id = "en014-first-t-plus-one"
expect = "survive"
misunderstanding = "EN-014: the tag is checked over the first t + 1 partials. Argued equivalent, as en014-first-round-all: with at least t partials, the first round opens on the first t + 1 only if it would open on the first t, and when it does not open the fallback over the proved partials decides; the fallback also takes the first t + 1 proved partials, which open exactly when the dealing is good, as the first t do (allProved holds on proved partials). So both readings give opened when the dealing is good and at least t partials are proved, dealer_fault when it is bad and at least t are proved, and need_more otherwise. Tried: every combine case of the corpus, including combine-second-bad and combine-fallback-open."
  [[mutation.edit]]
  rule = "split_envelope--take_n_3"
  find = "ListItem(_P:Partial) _ ) => .List"
  replace = "ListItem(P:Partial) _ ) => ListItem(P:Partial)"
