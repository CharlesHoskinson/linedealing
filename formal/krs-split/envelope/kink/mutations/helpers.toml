# Misreadings of the helper functions that the header checks (EN-009 to EN-013), the
# current-epoch list (EN-005) and the PRF combination (EN-014, RQ-015) read. Every
# helper equation is a rule of the definition, so each one is a mutation target.

[[mutation]]
id = "en009-any-nonzero-empty"
expect = "kill"
misunderstanding = "EN-009: an unused region with no entries left counts as a nonzero entry"
  [[mutation.edit]]
  rule = "split_envelope--any_nonzero_1"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "en009-first-unused-only"
expect = "kill"
misunderstanding = "EN-009: only the first unused body or capsule entry must be zero"
  [[mutation.edit]]
  rule = "split_envelope--any_nonzero_2_1"
  find = "=> anyNonzero ( Rest:List )"
  replace = "=> false"

[[mutation]]
id = "en009-nonzero-needs-two"
expect = "kill"
misunderstanding = "EN-009: an unused region is bad only when two of its entries are nonzero"
  [[mutation.edit]]
  rule = "split_envelope--any_nonzero_2_2"
  find = "=> true"
  replace = "=> anyNonzero ( Rest:List )"

[[mutation]]
id = "en016-schnorr-k-bodies"
expect = "kill"
misunderstanding = "EN-016, EN-009: a Schnorr header holds K variant bodies, as an ECDSA header does"
  [[mutation.edit]]
  rule = "split_envelope--body_count_1"
  find = "=> sumMin ( Kk:Int , gOf ( Kk:Int ) )"
  replace = "=> Kk:Int"

[[mutation]]
id = "en016-ecdsa-generation-bodies"
expect = "kill"
misunderstanding = "EN-016, EN-009: an ECDSA header holds Σ min(v, G) variant bodies, as a Schnorr header does"
  [[mutation.edit]]
  rule = "split_envelope--body_count_2"
  find = "=> Kk:Int"
  replace = "=> sumMin ( Kk:Int , gOf ( Kk:Int ) )"

[[mutation]]
id = "en009-drop-past-end"
expect = "kill"
misunderstanding = "EN-009: a region whose entries are all used still has one nonzero entry past its end"
  [[mutation.edit]]
  rule = "split_envelope--drop_n_1"
  find = "=> .List"
  replace = "=> ListItem(1)"

[[mutation]]
id = "en009-skip-one-used"
expect = "kill"
misunderstanding = "EN-009: only the first entry of a region is a used one; every later entry must be zero"
  [[mutation.edit]]
  rule = "split_envelope--drop_n_2"
  find = "=> dropN ( N:Int -Int 1 , Rest:List )"
  replace = "=> Rest:List"

[[mutation]]
id = "en009-skip-one-unused"
expect = "kill"
misunderstanding = "EN-009: the first unused entry of a region is a pad and need not be zero"
  [[mutation.edit]]
  rule = "split_envelope--drop_n_3"
  find = "=> ListItem(X:Int) Rest:List"
  replace = "=> Rest:List"

[[mutation]]
id = "en011-slot-extra-index"
expect = "kill"
misunderstanding = "EN-011: the committee slot indices compared for repeats include one more index than the slots name"
  [[mutation.edit]]
  rule = "split_envelope--ells_1"
  find = "=> .List"
  replace = "=> ListItem(11)"

[[mutation]]
id = "en011-first-slot-only"
