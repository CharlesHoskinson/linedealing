[[mutation]]
id = "ledger3-named-resets"
expect = "survive"
misunderstanding = "SL-006, ledger 3: assigning prec moves a slot that is not UNNAMED back to NAMED. Argued equivalent: an ECDSA slot without prec is UNNAMED or BURNED (bstat moves only by setPrecE, a reserve of the prec holder, or a burn), and assignE skips BURNED, so setPrecE always meets UNNAMED. Tried: every ECDSA case."
  [[mutation.edit]]
  rule = "split_slots--set_prec_e_1_2"
  find = "Root:Root , Bstat:BStat , ListItem(E:Int)"
  replace = "Root:Root , NAMED , ListItem(E:Int)"

