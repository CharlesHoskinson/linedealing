[[mutation]]
id = "sl016-opened-unchecked"
expect = "survive"
misunderstanding = "SL-016: SLOT_TAKEN does not check that the header opened. Argued equivalent: takenFor needs a slot whose namers hold the request, and a namer is recorded only by an open that is not refused, which also records the request as opened (metaStep), so takenFor true implies opened. Tried: the in_force of request 5 that never opened (sl016-copied-in-force) and every in_force case of the corpus."
  [[mutation.edit]]
  rule = "split_slots--slot_taken_opened_1"
  find = "requires Eid:Int in Opened:List"
  replace = "requires true"
  [[mutation.edit]]
  rule = "split_slots--slot_taken_opened_2"
  find = "requires notBool Eid:Int in Opened:List"
  replace = "requires false"

