# Mutations of the helper equations of kink/definition.k: every equation the other files
# leave untargeted gets one plausible misreading. The `survive` entries edit equations that
# no reachable state enters; each carries its argument in `misunderstanding`.

[[mutation]]
id = "sl006-namer-first"
expect = "kill"
misunderstanding = "SL-006: a new ECDSA namer goes before the earlier namers"
  [[mutation.edit]]
  rule = "split_slots--add_namer_e_1"
  find = "Namers:List ListItem(pr ( Eid:Int , Pos:Int )) )"
  replace = "ListItem(pr ( Eid:Int , Pos:Int )) Namers:List )"

[[mutation]]
id = "sl021-first-ticket-unrecorded"
expect = "kill"
misunderstanding = "SL-021, SL-027: the first ticket a slot signs is not recorded"
  [[mutation.edit]]
  rule = "split_slots--add_signed_2"
  find = "=> ListItem(D:Int) Signed_2:List"
  replace = "=> Signed_2:List"

[[mutation]]
id = "sl016-c-empty-void"
expect = "kill"
misunderstanding = "SL-016: a committee open that names no slot is VOID"
  [[mutation.edit]]
  rule = "split_slots--any_taken_c_1"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "sl016-e-empty-void"
expect = "kill"
misunderstanding = "SL-016: an ECDSA open that names no slot under another precedence is VOID"
  [[mutation.edit]]
  rule = "split_slots--any_taken_e_1"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "sl006-no-namer-assigns"
expect = "survive"
misunderstanding = "SL-006: a slot with no namer in force gets the request 0. Argued equivalent: a slot gets prec only from a list of one namer. Header order (Q-003) gives every namer a higher board position than the ones before it, a committee slot takes prec at its first open (SL-004), and an ECDSA slot takes prec as soon as one namer is in force under its root (SL-006), so the earliest namer in force is never missing when a slot is assigned. Tried: every open and in_force case of the corpus."
  [[mutation.edit]]
  rule = "split_slots--assign_with_1"
  find = "=> X:ESlot"
  replace = "=> setPrecE ( 0 , X:ESlot )"

[[mutation]]
id = "sl006-earliest-dropped"
expect = "kill"
misunderstanding = "SL-006: the earliest namer in force is found but not given prec"
  [[mutation.edit]]
  rule = "split_slots--assign_with_2"
  find = "=> setPrecE ( E:Int , X:ESlot )"
  replace = "=> X:ESlot"

