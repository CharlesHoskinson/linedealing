[[mutation]]
id = "sstep-other-op-burns"
expect = "survive"
misunderstanding = "SL-018: an operation with no seat step burns the slot shares. Argued equivalent: mapS is called only by the rules of seat_bind, seat_release and seat_burn, and sStep has an equation for each, so the owise equation never runs. Tried: every seat case of the corpus."
  [[mutation.edit]]
  rule = "split_slots--s_step_4"
  find = "=> X:SeatSlot"
  replace = "=> sBurn ( X:SeatSlot )"

