id = "sl004-position-zero"
expect = "survive"
misunderstanding = "SL-004: every namer is at board position 0. Argued equivalent: a slot gets prec only from a list of one namer. Header order (Q-003) gives every namer a higher board position than the ones before it, a committee slot takes prec at its first open (SL-004), and an ECDSA slot takes prec as soon as one namer is in force under its root (SL-006), so `lowest` never compares two namers. Tried: every open and in_force case of the corpus."
  [[mutation.edit]]
  rule = "split_slots--pos_of_1"
  find = "=> B:Int"
  replace = "=> 0"

