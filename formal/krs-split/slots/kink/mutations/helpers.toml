[[mutation]]
id = "sl018-rebind-other-digest"
expect = "survive"
misunderstanding = "SL-018: a bind to another digest moves the slot to that digest. Argued equivalent: the refusals of the seat operation (SL-020, ledger 6) leave only a current bound(d) for a release and a free or bound(d) slot for a bind of d, so this arm of the slot step never runs. Tried: seat-life, seat-refusals, seat-current-later."
  [[mutation.edit]]
  rule = "split_slots--s_bind_2_2"
  find = "=> seatSlot ( Key:Int , bound ( D2:Int )"
  replace = "=> seatSlot ( Key:Int , bound ( D:Int )"

