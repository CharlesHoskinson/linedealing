# Reference suite for split-slots. The programs are typed cases: cases/*/case.toml.
# `krs kink coverage` must leave no obligation open, `krs kink run` must kill every
# mutation or carry an argued survivor, and `krs kink compare` checks the reference
# definition against the Lean oracle (corpus end equivalence: equal ends on every program).

[spec]
krs = { package = "split-slots-reference", definition = "main" }

# Unique-cause MC/DC on every guard.
[coverage]
mcdc = true

# Equations and conditions no reachable state enters; each argument names the requirement
# that rules the state out.
[[coverage.argued]]
item = "rule:crate::assign_with_1"
argument = "SL-006: assignE runs only from an open by a request in force under the slot's root or from in_force of a namer under that root, so the namers in force are never empty"

[[coverage.argued]]
item = "rule:crate::c_step_7"
argument = "mapC runs only for open_c, lapse, reserve, claim, end and burn_range; the step map is called only by the rules of the operations the step function has equations for, so the owise equation never runs"

[[coverage.argued]]
item = "rule:crate::e_step_7"
argument = "mapE runs only for open_e, in_force, reserve, claim, end and burn_pool; the step map is called only by the rules of the operations the step function has equations for, so the owise equation never runs"

[[coverage.argued]]
item = "rule:crate::s_step_4"
argument = "mapS runs only for seat_bind, seat_release and seat_burn; the step map is called only by the rules of the operations the step function has equations for, so the owise equation never runs"

[[coverage.argued]]
item = "rule:crate::eid_of_1"
argument = "SL-004, SL-006, Q-003: a slot takes prec from a list of one namer only. Header order gives each namer a higher board position than the ones before it, a committee slot takes prec at its first open, and an ECDSA slot takes prec as soon as one namer is in force under its root, so lowest never runs on two namers; lowest never runs on an empty list either"

[[coverage.argued]]
item = "rule:crate::pick_2_1"
argument = "SL-004, SL-006, Q-003: a slot takes prec from a list of one namer only. Header order gives each namer a higher board position than the ones before it, a committee slot takes prec at its first open, and an ECDSA slot takes prec as soon as one namer is in force under its root, so lowest never runs on two namers"

