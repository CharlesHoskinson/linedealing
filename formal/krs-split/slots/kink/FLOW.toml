argument = "SL-004, SL-006, Q-003: a slot takes prec from a list of one namer only. Header order gives each namer a higher board position than the ones before it, a committee slot takes prec at its first open, and an ECDSA slot takes prec as soon as one namer is in force under its root, so lowest never runs on two namers"

[[coverage.argued]]
item = "rule:crate::pos_of_1"
argument = "SL-004, SL-006, Q-003: a slot takes prec from a list of one namer only. Header order gives each namer a higher board position than the ones before it, a committee slot takes prec at its first open, and an ECDSA slot takes prec as soon as one namer is in force under its root, so lowest never runs on two namers; posOf is read only when two namers are compared"

