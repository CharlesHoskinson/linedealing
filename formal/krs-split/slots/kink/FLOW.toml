[budget]
time_ms = 600000

[[program]]
cases = "cases/*/case.toml"

# Spec anchor: the Lean oracle (formal/lean-split/slots, `lake build oracle`), through
# the schema-driven adapter that translates the KRS typed encoding to the oracle's JSON
# and back. No identity: the answers depend on the adapter, the schema and the binary,
# and one identity file cannot cover all three, so kink caches none (practice 26).
[[implementation]]
name = "lean-oracle"
command = ["python3", "-I", "../../scripts/oracle_adapter.py", "../schema.json",
           "../../../lean-split/slots/.lake/build/bin/oracle"]
given = "inputs"
omits = ["k", "ops"]
views = [{ name = "end", required = true }]
