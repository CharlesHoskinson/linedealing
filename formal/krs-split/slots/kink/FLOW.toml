argument = "SL-012: B is a natural number at least 1 (judge refuses B = 0), so h + B < l implies h < l; no index has h + B < l with h < l false"

[[coverage.argued]]
item = "requirement:crate::verdict_of_5:h + bw < l:mcdc"
