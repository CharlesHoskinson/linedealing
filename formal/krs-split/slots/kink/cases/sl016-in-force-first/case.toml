# SL-016 (DECISIONS 68): request 2 is in force before its header opens and names the slot
# that request 1 holds: VOID SLOT_TAKEN at the open. Request 3 names the same slot and never
# comes into force: no SLOT_TAKEN; it lapses (SL-005) and the slot keeps request 1.
# Request 4 is in force and opens a free slot: it takes the slot and is not VOID.
[inputs]
params = { Params = { mode = "Tee", w = 2 } }
ops = [
  { DealC = { suite = "Bip340", epoch = 3, kcount = 2 } },
  { OpenC = { eid = 1, pos = 10, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }] } },
  { InForce = { eid = 2, root = "Own" } },
  { OpenC = { eid = 2, pos = 20, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }] } },
  { OpenC = { eid = 3, pos = 30, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }] } },
  { Lapse = { eid = 3 } },
  { InForce = { eid = 4, root = "Own" } },
  { OpenC = { eid = 4, pos = 40, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 2 } }] } },
]
