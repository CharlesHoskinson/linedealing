# SL-016: an ECDSA header is VOID when a later named slot is under a precedence in force;
# the check runs when its authorization comes into force (DECISIONS 68).
[inputs]
params = { Params = { mode = "Tee", w = 2 } }
ops = [
  { DealE = { pool = 1, leaf_set = 5, root = "Own", kcount = 2 } },
  { InForce = { eid = 1, root = "Own" } },
  { OpenE = { eid = 1, pos = 10, names = [{ Ek = { pool = 1, idx = 2 } }] } },
  { OpenE = { eid = 2, pos = 20, names = [{ Ek = { pool = 1, idx = 1 } }, { Ek = { pool = 1, idx = 2 } }] } },
  { InForce = { eid = 2, root = "Own" } },
]
