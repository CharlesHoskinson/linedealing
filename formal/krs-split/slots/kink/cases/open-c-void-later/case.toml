# SL-016: a header is VOID when a later named slot is taken, the earlier ones free; the
# check runs when its authorization comes into force (DECISIONS 68).
[inputs]
params = { Params = { mode = "Tee", w = 2 } }
ops = [
  { DealC = { suite = "Bip340", epoch = 3, kcount = 2 } },
  { OpenC = { eid = 1, pos = 10, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 2 } }] } },
  { OpenC = { eid = 2, pos = 20, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }, { Ck = { suite = "Bip340", epoch = 3, idx = 2 } }] } },
  { InForce = { eid = 2, root = "Own" } },
]
