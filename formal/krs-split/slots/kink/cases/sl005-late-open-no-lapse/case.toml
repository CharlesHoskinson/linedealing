# SL-005 (oracle pin `pin_sl005_no_lapse`): the same headers as sl005-late-open with no
# lapse: request 2 takes a live precedence on slot 2, which stays NAMED.
[inputs]
params = { Params = { mode = "Tee", w = 2 } }
ops = [
  { DealC = { suite = "Bip340", epoch = 3, kcount = 2 } },
  { OpenC = { eid = 1, pos = 10, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }] } },
  { OpenC = { eid = 2, pos = 20, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 2 } }] } },
]
