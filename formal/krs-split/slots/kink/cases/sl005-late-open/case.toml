# SL-005, SL-010 (DECISIONS 63, ledger 10, oracle pin `lateOpen`): request 2 lapses before
# its header opens; at the open it takes precedence on slot 2, the precedence is lapsed and
# the slot burns at once. Request 1's slot 1 keeps NAMED.
[inputs]
params = { Params = { mode = "Tee", w = 2 } }
ops = [
  { DealC = { suite = "Bip340", epoch = 3, kcount = 2 } },
  { Lapse = { eid = 2 } },
  { OpenC = { eid = 1, pos = 10, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 1 } }] } },
  { OpenC = { eid = 2, pos = 20, names = [{ Ck = { suite = "Bip340", epoch = 3, idx = 2 } }] } },
]
