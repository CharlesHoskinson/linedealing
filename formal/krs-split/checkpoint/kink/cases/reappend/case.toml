# CP-042, CP-004, CP-010: the board loses its uncovered tail; the RAM copies stay, so a
# checkpoint that records the boot counter is refused; a verified read appends each lost
# statement again after the board's own; a landing that carries a statement removes it
# from RAM and from the board
[inputs]
params = { Params = { n = 4, f = 1, mode = "Tee", bb = 10, slot_anchor = false, d_rec = 30 } }
ops = [
  { Land = { c = { CpOf = { seq = 0, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 100, pending_min = 101, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [], restart_seq = 0, seat_roots = [], restores = [] } }, mh = 1000 } },
  { RestoreDone = { r = { Rd = { seat = 1, boot_ctr = 1, cp_seq = 0, whole = false } } } },
  { RestoreDone = { r = { Rd = { seat = 2, boot_ctr = 1, cp_seq = 0, whole = false } } } },
  { LoseTail = {} },
  { RestoreDone = { r = { Rd = { seat = 3, boot_ctr = 1, cp_seq = 0, whole = false } } } },
  { Land = { c = { CpOf = { seq = 1, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 101, pending_min = 102, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [{ P = [1, 1] }], restart_seq = 0, seat_roots = [], restores = [] } }, mh = 1000 } },
  { MayReboot = {} },
  { ReadLedger = { ok = true, tickets = [{ P = [0, 0] }, { P = [1, 0] }, { P = [2, 0] }, { P = [3, 0] }], cov = [] } },
  { Land = { c = { CpOf = { seq = 1, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 101, pending_min = 102, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [{ P = [1, 1] }], restart_seq = 0, seat_roots = [], restores = [{ Rd = { seat = 1, boot_ctr = 1, cp_seq = 0, whole = false } }] } }, mh = 1000 } },
  { ReadLedger = { ok = true, tickets = [{ P = [0, 0] }, { P = [1, 0] }, { P = [2, 0] }, { P = [3, 0] }], cov = [] } },
]
