  { Land = { c = { CpOf = { seq = 4, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 125, pending_min = 121, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [], restart_seq = 0, seat_roots = [], restores = [{ Rd = { seat = 3, boot_ctr = 0, cp_seq = 2, whole = false } }] } }, mh = 1000 } },
