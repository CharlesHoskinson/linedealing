# CP-021, CP-027, ledger 12: the marker lands but w + 1 seats are not continuous, so the
# restart stays open; an account pool opened after the marker is not burned, a bind
# runs, and a second whole read of the same generation burns no account slot again
[inputs]
params = { Params = { n = 4, f = 1, mode = "Tee", bb = 10, slot_anchor = false, d_rec = 30 } }
ops = [
  { Land = { c = { CpOf = { seq = 0, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 100, pending_min = 101, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [], restart_seq = 0, seat_roots = [], restores = [] } }, mh = 1000 } },
  { ReadLedger = { ok = true, tickets = [{ P = [0, 1] }, { P = [1, 1] }, { P = [2, 1] }, { P = [3, 1] }], cov = [] } },
  { OpenAcct = { a = { AcctOf = { id = 8, slots = ["Free"], mark = 0, refill = false } } } },
  { Land = { c = { CpOf = { seq = 1, epoch = 3, board_height = 100, board_root = 0, witness_root = 0, pools = [{ PoolOf = { pool = 1, h = 110, pending_min = 111, pending = [], pending_count = 0 } }], settle = [], bf = [], boot_counters = [{ P = [0, 2] }, { P = [1, 2] }, { P = [2, 2] }, { P = [3, 2] }], restart_seq = 0, seat_roots = [], restores = [{ Rd = { seat = 0, boot_ctr = 2, cp_seq = 0, whole = true } }, { Rd = { seat = 1, boot_ctr = 2, cp_seq = 0, whole = true } }, { Rd = { seat = 2, boot_ctr = 2, cp_seq = 0, whole = true } }, { Rd = { seat = 3, boot_ctr = 2, cp_seq = 0, whole = true } }] } }, mh = 1000 } },
  { OpenAcct = { a = { AcctOf = { id = 9, slots = ["Free", "Free"], mark = 1, refill = false } } } },
  { BindAcct = { aid = 9, i = 0, d = 5 } },
  { ReadLedger = { ok = true, tickets = [{ P = [0, 1] }, { P = [1, 1] }, { P = [2, 1] }, { P = [3, 1] }], cov = [] } },
]
