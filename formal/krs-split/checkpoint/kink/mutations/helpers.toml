misunderstanding = "CP-031: slot 9 of seat 9 is always reshared"
  [[mutation.edit]]
  rule = "split_checkpoint--reshare_list_1"
  find = "=> .List"
  replace = "=> ListItem(pr ( 9 , 9 ))"

[[mutation]]
id = "cp031-anchor-reshares-none"
expect = "kill"
misunderstanding = "CP-031: with slot anchors no slot is reshared"
  [[mutation.edit]]
  rule = "split_checkpoint--reshare_of_1"
  find = "=> reshareList ( Slots:List )"
  replace = "=> .List"

[[mutation]]
id = "cp032-no-anchor-reshares"
expect = "kill"
misunderstanding = "CP-032: without slot anchors the uncovered slots are reshared"
  [[mutation.edit]]
  rule = "split_checkpoint--reshare_of_2"
  find = "reshareOf ( P:Params , _ ) => .List"
  replace = "reshareOf ( P:Params , Slots:List ) => reshareList ( Slots:List )"

[[mutation]]
id = "cp017-no-tickets-outside"
expect = "kill"
misunderstanding = "CP-017: every ticket list holds a seat outside the committee"
  [[mutation.edit]]
  rule = "split_checkpoint--seat_outside_1"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "cp012-phantom-leaf"
expect = "kill"
misunderstanding = "CP-012: every bf_root holds nf 77"
  [[mutation.edit]]
  rule = "split_checkpoint--seconds_1"
  find = "=> .List"
  replace = "=> ListItem(77)"

[[mutation]]
id = "cp012-nfs-unread"
expect = "kill"
misunderstanding = "CP-012: the leaves' nf are not read"
  [[mutation.edit]]
  rule = "split_checkpoint--seconds_2"
  find = "=> ListItem(B:Int) seconds"
  replace = "=> seconds"

[[mutation]]
id = "cp024-burns-after-restart"
expect = "kill"
misunderstanding = "CP-024, CP-027: a session opened outside a restart opens with every burn"
  [[mutation.edit]]
  rule = "split_checkpoint--session_burns_2"
  find = "sessionBurns ( Open:Bool , _ , _ ) => .List"
  replace = "sessionBurns ( Open:Bool , Burn:List , _ ) => Burn:List"

[[mutation]]
id = "cp025-bind-past-end"
expect = "survive"
misunderstanding = "CP-025: a bind past the end of the pool adds a free slot. Survives by construction: bind_account is refused unless slot i is free (ledger 5), so the bind never runs past the end"
  [[mutation.edit]]
  rule = "split_checkpoint--set_bound_1"
  find = "=> .List"
  replace = "=> ListItem(free)"

[[mutation]]
id = "cp025-bind-wrong-digest"
expect = "kill"
misunderstanding = "CP-025: the slot is bound to another digest"
  [[mutation.edit]]
  rule = "split_checkpoint--set_bound_2_1"
  find = "=> ListItem(bound ( D:Int )) Rest:List"
  replace = "=> ListItem(bound ( D:Int +Int 1 )) Rest:List"

[[mutation]]
id = "ledger5-free-everywhere"
expect = "kill"
misunderstanding = "ledger 5 (CP-025): a slot of an unknown account pool is free"
  [[mutation.edit]]
  rule = "split_checkpoint--slot_free_1"
  find = "=> false"
  replace = "=> true"

[[mutation]]
id = "cp014-sort-phantom"
expect = "kill"
misunderstanding = "CP-014: the sorted list always holds index 0"
  [[mutation.edit]]
  rule = "split_checkpoint--sort_nat_1"
  find = "=> .List"
  replace = "=> ListItem(0)"

[[mutation]]
id = "cp014-no-sort"
expect = "kill"
misunderstanding = "CP-014: the live indices are not sorted"
  [[mutation.edit]]
  rule = "split_checkpoint--sort_nat_2"
  find = "=> insertSorted ( X:Int , sortNat ( Rest:List ) )"
  replace = "=> ListItem(X:Int) sortNat ( Rest:List )"

[[mutation]]
id = "cp013-void-empty"
expect = "kill"
misunderstanding = "CP-013: no settle_root keeps the VOID records"
  [[mutation.edit]]
  rule = "split_checkpoint--void_kept_1"
  find = "=> true"
  replace = "=> false"

[[mutation]]
id = "cp011-restart-seq-off"
expect = "kill"
misunderstanding = "CP-011: the contract sets restart_seq one above the value it computes"
  [[mutation.edit]]
  rule = "split_checkpoint--with_restart_seq_1"
  find = "V:Int , SeatRoots"
  replace = "V:Int +Int 1 , SeatRoots"
