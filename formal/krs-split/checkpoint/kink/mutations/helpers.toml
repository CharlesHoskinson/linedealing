# One mutation per helper-function equation of kink/definition.k (the `mutations`
# gate fails on an untargeted equation). Each names the EARS ID that the equation serves.

[[mutation]]
id = "cp026-acct-id-zero"
expect = "kill"
misunderstanding = "CP-026: an account pool is known by slot 0's id, so every pool counts as pool 0"
  [[mutation.edit]]
  rule = "split_checkpoint--acct_id_1"
  find = "=> Id:Int"
  replace = "=> 0"

[[mutation]]
id = "cp013-all-in-empty"
expect = "kill"
misunderstanding = "CP-013: an empty settle_root never matches the ended requests"
  [[mutation.edit]]
  rule = "split_checkpoint--all_in_1"
  find = "=> true"
  replace = "=> false"

[[mutation]]
id = "cp013-all-in-skip"
expect = "kill"
misunderstanding = "CP-013: a leaf that did not end is skipped, not refused"
  [[mutation.edit]]
  rule = "split_checkpoint--all_in_2_2"
  find = "=> false"
  replace = "=> allIn ( Rest:List , Ended:List )"

[[mutation]]
id = "cp010-phantom-statement"
expect = "kill"
misunderstanding = "CP-010: seat 0's boot counter 1 has a standing RestoreDone"
  [[mutation.edit]]
  rule = "split_checkpoint--all_restores_1"
  find = "=> .List"
  replace = "=> ListItem(rd ( 0 , 1 , 0 , false ))"

[[mutation]]
id = "cp029-anchor-adds-pool"
