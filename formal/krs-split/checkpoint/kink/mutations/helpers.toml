misunderstanding = "CP-029: anchoring adds an account pool"
  [[mutation.edit]]
  rule = "split_checkpoint--anchor_accts_1"
  find = "=> .List"
  replace = "=> ListItem(acct ( 9 , .List , 0 , false ))"

