  replace = "=> .List"

[[mutation]]
id = "h-after-carry-3"
expect = "kill"
misunderstanding = "AU-021, AU-022: a carried leaf settles auth_0 VOID even when it is not valid"
  [[mutation.edit]]
  rule = "split_authorization--after_carry_2"
  find = "carryOk ( Q:Int , K:Carry )"
  replace = "true"
  [[mutation.edit]]
  rule = "split_authorization--after_carry_3"
  find = "carryOk ( Q:Int , K:Carry )"
  replace = "true"

