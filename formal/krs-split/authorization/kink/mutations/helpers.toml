# Misreadings of the helper functions: every equation of the definition is a mutation target,
# so each helper equation no other file edits has one here, named for the requirement it serves.

[[mutation]]
id = "h-add-auth-2"
expect = "kill"
misunderstanding = "AU-004: an authorize moves every record to PENDING with the new authorization, not only the named one"
  [[mutation.edit]]
  rule = "split_authorization--add_auth_1"
  find = "Rid:Int ==Int Crid:Int"
  replace = "true"
  [[mutation.edit]]
  rule = "split_authorization--add_auth_2"
  find = "Rid:Int =/=Int Crid:Int"
  replace = "false"

[[mutation]]
id = "h-add-auth-all-1"
expect = "kill"
misunderstanding = "AU-004: an authorize adds a record"
  [[mutation.edit]]
  rule = "split_authorization--add_auth_all_1"
  find = "=> .List"
  replace = "=> ListItem(rec ( 77 , 0 , profP0 , false , rsUNSPENT , fresh ( 77 ) , .List , 0 , .List , .List , false , .List ))"

[[mutation]]
id = "h-add-auth-all-2"
expect = "kill"
misunderstanding = "AU-005: add_auth_all_2 drops each element instead of keeping it"
  [[mutation.edit]]
  rule = "split_authorization--add_auth_all_2"
  find = "=> ListItem(addAuth ( C:Call , R:Rec )) addAuthAll ( C:Call , Rest:List )"
  replace = "=> addAuthAll ( C:Call , Rest:List )"

[[mutation]]
id = "h-after-carry-1"
