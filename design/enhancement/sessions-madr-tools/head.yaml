outcomes_note: The owner asked that sessions survive any failure, persist nonce material under the witness fence and form a generic seald primitive (SRC-008). G1 to G5 derive the observable goals from that request. The owner has not confirmed their wording.
outcomes:
  - {id: G1, state: provisional, basis: derived, version: 1, source_refs: [SRC-001, SRC-008], statement_ref: design.md G1, success: Every session opens again after a VM reboot, a replacement VM in the same seat and a whole-committee restart.}
  - {id: G2, state: provisional, basis: derived, version: 1, source_refs: [SRC-001, SRC-008], statement_ref: design.md G2, success: No nonce slot releases partials for two tickets while c <= n - 1 - 2f.}
  - {id: G3, state: provisional, basis: derived, version: 1, source_refs: [SRC-001, SRC-008], statement_ref: design.md G3, success: No nonce slot is used twice after a whole-committee restart, also from rolled-back disks. The loss is bounded as D-002 states.}
  - {id: G4, state: provisional, basis: derived, version: 1, source_refs: [SRC-001, SRC-008], statement_ref: design.md G4, success: A destroyed entry or a consumed slot share does not open again from an old ciphertext within the bound of G2.}
  - {id: G5, state: provisional, basis: derived, version: 1, source_refs: [SRC-001, SRC-008], statement_ref: design.md G5, success: Each session key needs partials from t distinct share holders that serve only the latest boot and an approved app image.}
actors:
  - {id: ACT-001, name: committee application, role: Calls seald.sock, votes on request headers, writes checkpoints and ends requests that hold burned slots.}
  - {id: ACT-002, name: operator, role: Runs the VM of one seat. Can roll back the disk of its seat and boot an own app disk.}
  - {id: ACT-003, name: recovery group E, role: Reprovisions committee shares and unused ECDSA slots (split-line DESIGN 7.11).}
  - {id: ACT-004, name: owner of a request, role: Posts a voided request again.}
scope:
  included:
    - The seald session store, its records, keys, restore and app API.
    - The peer witness for session versions, nonce slots and replicas.
    - The checkpoint fields, the seat logs on the board, the RestoreDone statement and the contract rules that seald depends on.
  excluded:
    - The recovery group transport (split-line DESIGN 7.11). The design depends on it for account-pool supply.
    - Confidentiality against t colluding broken enclaves (design non-goal).
    - Liveness with fewer than t live nodes (design non-goal).
glossary:
  - {id: GLO-001, term: seat, context: CTX-001, meaning: One committee position, node_index in the code and node_id in split-line DESIGN.}
  - {id: GLO-002, term: nonce slot, context: CTX-001, meaning: "One committee nonce slot of split-line DESIGN 4.1, named by (purpose, index). States: absent, free, bound(share, d), burned."}
  - {id: GLO-003, term: sequential pool, context: CTX-001, meaning: A pool that reserves indices in increasing order, listed in sequential_pools.}
  - {id: GLO-004, term: account pool, context: CTX-001, meaning: Any other session that holds nonce slots, such as the per-address ECDSA slots.}
  - {id: GLO-005, term: version, context: CTX-001, meaning: "In the session store: v, the highest version with w acks, and v_max, the highest version sealed or learned."}
  - {id: GLO-006, term: version, context: CTX-002, meaning: "In the peer witness: pv, the highest version that this peer witnessed for (node_index, sid), with pe, pd and the signed statement."}
  - {id: GLO-007, term: checkpoint, context: CTX-004, meaning: "The Midnight Checkpoint record: seq, h and pending per sequential pool, boot_counters per seat and restart_seq."}
  - {id: GLO-008, term: checkpoint, context: CTX-001, meaning: "A seal of work as version v_max + 1 with its witness round (SS-020). Not the Midnight record."}
  - {id: GLO-009, term: continuous seat, context: CTX-001, meaning: A seat whose latest boot counter equals the counter in the latest Midnight checkpoint.}
  - {id: GLO-010, term: restart marker, context: CTX-004, meaning: "cp.restart_seq: the seq of the latest checkpoint that recorded a whole-committee restart (SS-121, SS-122)."}
  - {id: GLO-011, term: restart mark, context: CTX-001, meaning: "work.restart_mark: the restart marker that the account-pool slots of one session were last burned against."}
  - {id: GLO-012, term: record, context: CTX-001, meaning: The sealed form of one session version (SS-008).}
  - {id: GLO-013, term: replica, context: CTX-002, meaning: A peer's copy of the latest record of another seat's session, on its /mnt/persist.}
  - {id: GLO-014, term: put entry, context: CTX-001, meaning: "(put digest, put_tag) in the seat log of a seat, one for each account-pool share put (SS-128)."}
  - {id: GLO-016, term: seat log, context: CTX-004, meaning: "The append-only log of one seat on the board: put entries, binding entries and RestoreDone statements. Each checkpoint chains one root per seat over it (SS-136, SS-137)."}
  - {id: GLO-017, term: covered entry, context: CTX-004, meaning: "A seat-log entry in a board block at or below the board height of a landed Midnight checkpoint. Entries above it are the tail."}
  - {id: GLO-018, term: slot nullifier, context: CTX-001, meaning: "nf = HMAC-SHA256(k_nf, VT1/slot-nf, committee, purpose, index): the name of a nonce slot in a binding entry, with no purpose and no index in the clear (SS-070)."}
  - {id: GLO-015, term: restart generation, context: CTX-001, meaning: "The time from a whole-committee restart until a checkpoint with a higher restart_seq and w + 1 continuous seats (SS-133)."}
contexts:
  - id: CTX-001
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-002]
    name: seald session store
    purpose: Keep the durable state of one seat sealed, versioned and restorable, and keep each nonce slot on its one-way path.
    model_owner: seald (server/seald, session module)
    module_refs: [MOD-001]
    glossary_refs: [GLO-001, GLO-002, GLO-003, GLO-004, GLO-005, GLO-008, GLO-009, GLO-011, GLO-012]
    relationships: [CON-001, CON-002, CON-003, CON-004, CON-005, CON-006]
    boundary: proposed
  - id: CTX-002
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-002, SRC-009]
    name: peer witness
    purpose: Hold, for every other seat, the fence of that seat (highest signed version, slot bindings) and the replicas, and serve PRF partials only under the fence.
    model_owner: seald (server/seald, witness.rs and peer.rs)
    module_refs: [MOD-002]
    glossary_refs: [GLO-006, GLO-013]
    relationships: [CON-002]
    boundary: existing, extended with session and slot entries
  - id: CTX-003
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-009]
    name: committee application
    purpose: Run the requests of split-line dealing. Reserve slots, vote headers, write checkpoints and void requests whose slots burned.
    model_owner: the committee application (outside seald)
    module_refs: [MOD-003]
    glossary_refs: []
    relationships: [CON-001, CON-003, CON-005]
    boundary: existing
  - id: CTX-004
    version: 2
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-002, SRC-009]
    name: Midnight committee contract
    purpose: Accept or refuse checkpoints and the restore statements that they carry, and chain the seat-log roots, against the rules that seald cannot enforce.
    model_owner: the committee contract on Midnight and the follower in veritee_verify
    module_refs: [MOD-004]
    glossary_refs: [GLO-007, GLO-010, GLO-016, GLO-017]
    relationships: [CON-003, CON-004, CON-005, CON-007]
    boundary: existing, extended with new checkpoint fields and rules
aggregates:
  - id: AGG-001
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-002]
    name: session
    context: CTX-001
    module: MOD-001
    root_identity: "sid = SHA-256(VT1/session-id, committee, node_index, purpose)"
    holds: "v, v_max, epoch, open, work (entries, slots, restart_mark), unsealed, dirty, and the records of the session on /mnt/persist"
    invariant_refs: [INV-007, INV-008, INV-010]
    atomic_scope: One operation of one session runs to its result before the next (SS-107). A version becomes current only with w peer acks (SS-023), so the commit of the aggregate spans the peer witness of other seats.
    consistency_assumptions: [ASM-001]
    decision_refs: [D-001, D-003, D-007, D-015, D-016, D-020]
  - id: AGG-002
    version: 2
    state: provisional
    basis: proposed
    source_refs: [SRC-002, SRC-009]
    name: nonce slot pool
    context: CTX-001
    module: MOD-001
    root_identity: The session of the pool, sid of (node_index, purpose). Each slot is (purpose, index) inside work.slots.
    holds: The slot states of one pool for one seat, the put tags and restart mark of an account pool, and the slot witness entries at the peers.
    invariant_refs: [INV-001, INV-002, INV-009]
    atomic_scope: A slot state changes only inside a session version of AGG-001. A bind first takes w acks for the slot witness entry and then seals the version (SS-050, SS-051), so one bind changes two consistency boundaries in a fixed order.
    consistency_assumptions: [ASM-001, ASM-002]
    decision_refs: [D-002, D-006, D-011, D-018, D-022, D-024, D-027]
requirements_note: Each entry below references one SS requirement of spec.md. The statement and its scenarios stay in spec.md. Acceptance is the set of scenarios of that requirement.
modules:
  - id: MOD-001
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-003]
    name: session store
    context: CTX-001
    purpose: Sessions, records, keys, restore, nonce slot states, the window and the restart burns.
    responsibilities: [the app operations on seald.sock, checkpoint and restore of a session, the restart decision and every burn]
    exclusions: [peer-side fence state of other seats, checkpoint validity]
    owned_concepts: [session, record, working copy, nonce slot state, restart mark]
    inputs: [app requests (CON-001), peer answers (CON-002), checkpoint view (CON-003), committee.json (CON-006)]
    outputs: [records, witness requests, seat-log entries: RestoreDone statements (CON-004), binding entries (CON-005), put entries (CON-007)]
    dependency_refs: [MOD-002, MOD-004]
    code: [server/seald/src/session.rs, api.rs, group.rs, store.rs, recovery.rs]
  - id: MOD-002
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-003]
    name: peer witness
    context: CTX-002
    purpose: Fence entries, replicas and PRF partials for the other seats.
    responsibilities: [session_witness, session_partial, session_fetch, the witness sync, the blank-tier-0 fetch, pruning of covered slot entries]
    exclusions: [the sessions of its own seat]
    owned_concepts: [pv, pe, pd, signed statement, slot entry, replica]
    inputs: [peer requests (CON-002)]
    outputs: [acks, refusals, partials, replicas]
    dependency_refs: [MOD-004]
    code: [server/seald/src/witness.rs, peer.rs]
  - id: MOD-003
    version: 1
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-009]
    name: committee application
    context: CTX-003
    purpose: The app side of Sessions. It holds no SS requirement as accountable owner.
    responsibilities: [calls the session API, applies the window when it votes a header, reserves sequential indices in increasing order, voids requests on burned slots, writes checkpoints]
    exclusions: [session keys and slot shares]
    owned_concepts: [request, header vote]
    inputs: [session results (CON-001)]
    outputs: [checkpoints with the batch roots and the carried RestoreDone statements (CON-003)]
    dependency_refs: [MOD-001, MOD-004]
  - id: MOD-004
    version: 2
    state: provisional
    basis: proposed
    source_refs: [SRC-001, SRC-002]
    name: committee contract
    context: CTX-004
    purpose: The checkpoint, statement and seat-log root rules on Midnight.
    responsibilities: [SS-103, SS-104, SS-117, SS-121, SS-122, SS-136]
    exclusions: [any slot id or account id on Midnight]
    owned_concepts: [checkpoint, restart marker, seat-log root]
    inputs: [checkpoints with batch roots and RestoreDone statements]
    outputs: [the ledger view that seald reads]
    dependency_refs: []
contracts:
