journeys:
  - {id: JNY-001, version: 1, state: provisional, basis: explicit, source_refs: [SRC-001], actor: ACT-002, trigger: A VM reboot of one seat, handoffs: [MOD-001, MOD-002, MOD-004], success: The seat restores the latest committed version and pending requests continue, failure: Fewer than t partials or w acks keep the session closed, requirement_refs: [SS-030, SS-031, SS-036, SS-069, SS-112]}
  - {id: JNY-002, version: 2, state: provisional, basis: explicit, source_refs: [SRC-001], actor: ACT-002, trigger: A replacement VM with a blank disk in one seat, handoffs: [MOD-001, MOD-002], success: The seat fetches its records and its fence entries and replicas for the other seats and reopens its sessions, failure: A peer without a replica answers not_found, requirement_refs: [SS-033, SS-038, SS-039, SS-102, SS-126, SS-127]}
  - {id: JNY-003, version: 2, state: provisional, basis: explicit, source_refs: [SRC-001], actor: ACT-002, trigger: A whole-committee restart, also from rolled-back disks, handoffs: [MOD-001, MOD-002, MOD-003, MOD-004], success: Nodes that read one checkpoint burn the same sequential sets and each account pool once, the contract records the jump and the marker, and nodes that boot later burn their account pools, failure: A ledger read failure keeps the node not_ready, requirement_refs: [SS-067, SS-068, SS-104, SS-106, SS-112, SS-113, SS-114, SS-120, SS-121, SS-123, SS-124, SS-125, SS-133]}
  - {id: JNY-004, version: 1, state: provisional, basis: explicit, source_refs: [SRC-001], actor: ACT-001, trigger: A request reserves a nonce slot, handoffs: [MOD-003, MOD-001, MOD-002], success: The slot binds to one digest and releases only for it, failure: conflict, window_exceeded, slot_stale or no_checkpoint, requirement_refs: [SS-050, SS-051, SS-055, SS-063, SS-064, SS-065, SS-057]}
  - {id: JNY-005, version: 1, state: provisional, basis: explicit, source_refs: [SRC-001], actor: ACT-001, trigger: An epoch change, handoffs: [MOD-001, MOD-002], success: Every session moves to the new epoch before the old share is erased, failure: epoch_in_use, requirement_refs: [SS-078, SS-079, SS-080]}
assumptions:
  - {id: ASM-001, version: 2, state: provisional, basis: explicit, source_refs: [SRC-001, SRC-009], statement: "c <= n - 1 - 2f, where c counts, for one session, colluding operators and each seat whose tier 0 was lost or rolled back after the current version committed, the restoring seat included. A lost seat stops counting when its SS-102 fetch completes (D-026)", rationale: The fence of split-line DESIGN 7.7 holds only in this bound, affected: [G2, G4, INV-001], validation: QI-01 to QI-04, if_false: A whole-committee restart rule applies instead (D-002)}
  - {id: ASM-002, version: 1, state: provisional, basis: explicit, source_refs: [SRC-009], statement: The committee posts a checkpoint about every 60 seconds (split-line DESIGN 7.13), rationale: B and the account-pool bind gate of SS-124 then do not limit throughput, affected: [D-009, D-024], validation: item 20 measurement, if_false: The window and the gate delay binds}
  - {id: ASM-003, version: 1, state: provisional, basis: explicit, source_refs: [SRC-001], statement: The TLS evidence moves out of PCR15, so that PCR15 has one value per approved image (guide recommendation 5), rationale: SS-110 needs it, affected: [D-003, D-019, SS-110], validation: item 24, if_false: An operator with an own app disk reads the secrets of its seat}
  - {id: ASM-004, version: 1, state: provisional, basis: proposed, source_refs: [SRC-002], statement: A running node reads each new checkpoint, rationale: SS-113 then sees a whole-committee restart before the restart checkpoint shows continuous seats, affected: [D-021, D-024], validation: QI-06, if_false: The node does not burn in this boot and burns its account pools at its next boot}
  - {id: ASM-005, version: 1, state: provisional, basis: proposed, source_refs: [SRC-002], statement: "The ledger snapshot that a node reads for its restart decision holds the boot tickets of the peers that answered its witness sync", rationale: "SS-067 and the restart marker of D-024 count continuous seats from that snapshot. A stale snapshot can show a whole-committee restart as continuous seats", affected: [D-005, D-024, SS-067], validation: "QI-05, QI-06 and QI-14 with a stale follower snapshot", if_false: A node can classify no restart and skip the burn while the fence does not hold}
  - {id: ASM-006, version: 1, state: provisional, basis: derived, source_refs: [SRC-011, SRC-012], statement: "Some reader can fetch every covered batch of each seat log: the board, a peer, the enclave copy on /mnt/persist or an operator archive outside the VM disks", rationale: "A root proves membership. The duplicate-put refusal and the recovery group's non-membership check need the full log (SS-138). The board keeps entries while it is safe: |C| <= f corrupt nodes in non-TEE mode (split-line DESIGN 4.1), and while the TEEs hold in TEE mode", affected: [D-027, D-032, D-033, SS-137, SS-138, SS-139], validation: "item 20 (withheld and lost-log tests), item 22 (QI-21)", if_false: "The account pools of that seat stop for good (log_unavailable). No share binds twice and nothing releases on an unverified log. Without slot_anchor the recovery group reissues no ECDSA slot, and the address refills."}
questions:
  - {id: Q-001, blocks_readiness: false, decision_owner: owner of the committee application, question: "The app must reserve sequential indices in increasing order and apply the window when it votes a header (design.md, SS-063 note). The committee application has no EARS spec, so these obligations have no authoritative requirement.", alternatives: [EARS requirements in a committee application capability, a constraint in split-line DESIGN 4.1 (item 25)], affected: [D-011, CON-001, MOD-003], reason: Safety does not depend on it (seald refuses with SS-063 and SS-064). The loss of D-002 does.}
  - {id: Q-002, blocks_readiness: false, decision_owner: lead, question: Values of session_window (B) and session_max_bytes (S_max), alternatives: [item 20 measurement], affected: [D-009, D-029, D-030, CON-006], reason: "The spec bounds both values. D-029 and D-030 give the measured sizes and the rule for B. The deployment picks the numbers."}
  - {id: Q-003, blocks_readiness: false, decision_owner: lead (item 25), question: "Mapping of split-line DESIGN 2.2, 4.1, 4.5, 7.4, 7.7, 7.8, 7.11 and C16 onto Sessions, with c counting a seat with lost tier 0 (B-F3)", alternatives: [], affected: [D-004, D-011], reason: Design documents only.}
  - {id: Q-004, blocks_readiness: false, decision_owner: lead (item 22), question: Do the threshold w + 1, the fork tie at n = 3f + 1 and the late-node contract rule hold in the model, alternatives: [], affected: [D-005, D-013, D-016], reason: Confirmation of provisional decisions.}
  - {id: Q-005, blocks_readiness: false, decision_owner: lead (item 24), question: "Work outside seald: Checkpoint fields (h, pending_min, pending_root, boot_counters, restart_seq, seat roots, carried RestoreDone), the board seat log and the contract rules in veritee_verify and the contract, ReadWritePaths for /mnt/persist", alternatives: [], affected: [CON-003, CON-004, MOD-004], reason: Implementation.}
  - {id: Q-006, blocks_readiness: false, decision_owner: lead (items 23 and 24), question: "Wire encodings, HKDF salt, HPKE context and signature labels (B-F17.1)", alternatives: [], affected: [CON-002, D-010], reason: Golden vectors fix them.}
  - {id: Q-007, blocks_readiness: false, decision_owner: lead (item 22), question: "A second whole-committee restart in one uptime of a running node: SS-113 fires only while whole_restart = false, and SS-114 burns once per boot", alternatives: [re-arm SS-113 at each new restart marker, accept the gap], affected: [D-021, D-024, D-028], reason: "Resolved by D-028 (SS-133). QI-18 confirms it."}
  - {id: Q-008, blocks_readiness: false, decision_owner: owner of the committee application, question: "The committee posts a checkpoint after each RestoreDone and before the next planned reboot, and sets B at least to its reservations per checkpoint interval (D-030). The committee application has no EARS spec.", alternatives: [EARS requirements in a committee application capability], affected: [D-030, MOD-003], reason: Loss and throughput depend on it. Safety does not.}
  - {id: Q-009, blocks_readiness: false, decision_owner: lead (item 25), question: "A reshare of a used ECDSA slot gives new share bytes with the same nonce, so the put entry does not stop it. Which ECDSA slots may the recovery group reissue after a rollback of every disk?", alternatives: [r1 reshare slots unclaimed on a board record with valid QCs, r2 burn above a floor and reshare under new indices, r3 reshare only a slot that no covered binding entry binds under slot_anchor and otherwise none], affected: [D-027, D-033], reason: "Resolved by r3 (DECISIONS 51 choice 8). Without slot_anchor the recovery group reissues no ECDSA slot and each address refills by a new slot session. A seat log that the recovery group cannot read in full counts as binding every slot of that seat."}
  - {id: Q-010, blocks_readiness: false, decision_owner: owner of the committee application, question: "The checkpoint signers must build each seat-log batch root from the board, sign no batch with a second put of one digest or a second binding of one nullifier, and set pending_min and pending_root from the pending set. The committee application has no EARS spec.", alternatives: [EARS requirements in a committee application capability, contract checks with proofs], affected: [D-032, D-034, CON-003], reason: The contract checks the root chain (SS-136) and pending_min (SS-104). seald checks the first entry (SS-129 to SS-131, SS-119) and accepts no pending proof below pending_min (SS-064).}
