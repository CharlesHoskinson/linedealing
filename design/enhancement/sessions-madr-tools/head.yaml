  - {id: INV-004, version: 1, state: provisional, basis: explicit, source_refs: [SRC-002], rule: A peer holds one record per version, scope: context-wide (CTX-002), owner: MOD-002, participants: [], requirement_refs: [SS-095], verification: tasks.md 2.7}
