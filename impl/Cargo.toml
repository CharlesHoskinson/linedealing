[package]
name = "line-dealing"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = { version = "=0.13.4", features = ["arithmetic", "ecdsa", "schnorr", "sha256", "hash2curve"] }
sha2 = "=0.10.9"
ripemd = "=0.1.3"
sha3 = "=0.10.8"
curve25519-dalek = "=4.1.3"
ed25519-dalek = "=2.2.0"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.12.4"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
serde_json = "=1.0.154"

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "split"
harness = false

[profile.test]
opt-level = 2
